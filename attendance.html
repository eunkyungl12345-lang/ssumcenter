<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출석부 | 썸류센터</title>
<style>
  :root{color-scheme:dark;--bg:#0c0a08;--surface:#161310;--surface-2:#1e1811;--ink:#EDE0CC;--muted:#998870;--line:#2a2117;--line-strong:#3a2e1f;--amber:#E8B050;--ok:#6FBE97;--ink-on-amber:#171208;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.5;letter-spacing:-.01em}
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px 70px}
  h1{font-size:21px;font-weight:800}
  .sub{font-size:12.5px;color:var(--muted);margin:3px 0 18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}
  input{width:100%;background:var(--surface-2);border:1.5px solid var(--line-strong);border-radius:11px;padding:12px;font-size:14px;color:var(--ink);font-family:inherit}
  input:focus{outline:none;border-color:var(--amber)}
  select{width:100%;background:var(--surface-2);border:1.5px solid var(--line-strong);border-radius:11px;padding:12px;font-size:14px;color:var(--ink);font-family:inherit}
  select:focus{outline:none;border-color:var(--amber)}
  .rtabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .rtab{background:var(--surface);border:1px solid var(--line-strong);color:var(--muted);font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:20px;cursor:pointer;font-family:inherit}
  .rtab.on{background:var(--amber);border-color:var(--amber);color:var(--ink-on-amber)}
  .tbl-input{width:62px;flex:none;background:var(--surface-2);border:1.5px solid var(--amber);border-radius:9px;padding:9px 4px;font-size:15px;font-weight:800;color:var(--amber);font-family:inherit;text-align:center}
  .tbl-input:placeholder-shown{border-style:dashed;border-color:rgba(232,176,80,.55);background:transparent}
  .tbl-input:focus{outline:none;border-style:solid;border-color:var(--amber)}
  .tbl-input::placeholder{color:rgba(232,176,80,.7);font-weight:700;font-size:10.5px}
  .dcbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:12px}
  .dc-title{font-size:13px;font-weight:800;color:var(--amber);margin-bottom:9px}
  .dc-hint{font-size:11px;color:var(--muted);font-weight:600}
  .dc-row{display:flex;align-items:center;gap:11px;padding:6px 0}
  .dc-name{font-size:14.5px;font-weight:700;flex:1}
  .dc-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);font-size:19px;font-weight:800;cursor:pointer;font-family:inherit;line-height:1;flex:none}
  .dc-btn:active{transform:scale(.94)}
  .dc-num{min-width:36px;text-align:center;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
  .dc-auto{font-size:11px;color:var(--muted);min-width:46px;text-align:right}
  .btn{border:none;border-radius:11px;padding:12px 16px;font-size:14px;font-weight:800;color:var(--ink-on-amber);background:var(--amber);cursor:pointer;font-family:inherit;width:100%}
  .btn.g{background:transparent;color:var(--muted);border:1.5px solid var(--line-strong);width:auto;padding:9px 14px;font-size:12.5px;font-weight:750}
  .hide{display:none}
  .stat{display:flex;gap:9px;margin-bottom:14px}
  .stat .b{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 8px;text-align:center}
  .stat .b .k{font-size:11px;color:var(--muted)} .stat .b .v{font-size:22px;font-weight:800;margin-top:2px}
  .stat .b.on .v{color:var(--ok)}
  .row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:background .15s,border-color .15s;user-select:none;-webkit-tap-highlight-color:transparent}
  .row.present{background:rgba(111,190,151,.1);border-color:rgba(111,190,151,.4)}
  .chk{width:32px;height:32px;border-radius:9px;border:2px solid var(--line-strong);flex-shrink:0;display:grid;place-items:center;font-size:17px;color:transparent;transition:all .15s}
  .row.present .chk{background:var(--ok);border-color:transparent;color:#083b26}
  .nm{font-weight:800;font-size:15.5px} .nm .g{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px}
  .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .empty{text-align:center;color:var(--muted);padding:44px 0;font-size:13px}
  .spin{width:26px;height:26px;border:3px solid var(--line-strong);border-top-color:var(--amber);border-radius:50%;margin:34px auto;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  a.home{font-size:12px;color:var(--muted);text-decoration:none}
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .toolbar .cnt{font-size:12.5px;color:var(--muted);margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <!-- 로그인 -->
  <div id="login">
    <h1>📋 출석부</h1>
    <div class="sub">센터장 전용 · 관리자 비밀번호</div>
    <div class="card">
      <input id="pw" type="password" placeholder="admin 비밀번호">
      <div style="margin-top:12px"><button class="btn" id="loginBtn">로그인</button></div>
      <div id="login-msg" style="font-size:12.5px;color:#E8828A;margin-top:10px"></div>
    </div>
  </div>

  <!-- 콘솔 -->
  <div id="console" class="hide">
    <h1>📋 출석부 <span style="font-size:15px;color:var(--amber)">· <span id="at-round">8/27 (목)</span></span></h1>
    <div class="sub">도착한 분을 탭하면 출석 체크돼요 ✅ · 회차를 골라보세요<br><a class="home" href="/rotation-admin">← 로테이션</a> · <a class="home" href="/lineup">🎬 라인업</a> · <a class="home" href="/vote-admin">🗳️ 투표</a> · <a class="home" href="/admin">🏠 홈</a></div>
    <div class="rtabs" id="round-tabs"></div>
    <div class="stat">
      <div class="b on"><div class="k">출석</div><div class="v" id="s-present">–</div></div>
      <div class="b"><div class="k">전체</div><div class="v" id="s-all">–</div></div>
      <div class="b"><div class="k">남 / 여</div><div class="v" id="s-gender" style="font-size:17px">–</div></div>
    </div>
    <div class="toolbar">
      <button class="btn g" id="refreshBtn">새로고침</button>
      <button class="btn g" id="addBtn" style="color:var(--ok);border-color:var(--ok)">➕ 현장 추가</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="card hide" id="add-form" style="margin-bottom:12px">
      <div style="font-weight:800;font-size:14px;margin-bottom:10px">➕ 현장 참가자 추가 <span style="font-size:12px;color:var(--muted);font-weight:600">(문토 선결제 등)</span></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px">
          <input id="a-name" placeholder="이름 *" style="flex:1">
          <select id="a-gender" style="width:112px"><option value="">성별 *</option><option value="여성">여성</option><option value="남성">남성</option></select>
        </div>
        <div style="display:flex;gap:8px">
          <input id="a-birth" placeholder="출생연도(예:1995)" inputmode="numeric" style="flex:1">
          <input id="a-phone" placeholder="연락처(선택)" inputmode="tel" style="flex:1">
        </div>
        <select id="a-drink"><option value="">음료 선택 (선택)</option><option value="아이스 아메리카노">아이스 아메리카노</option><option value="아이스티">아이스티</option></select>
        <div style="display:flex;gap:8px;margin-top:2px">
          <button class="btn g" id="a-cancel" style="flex:1">닫기</button>
          <button class="btn" id="a-save" style="flex:2">출석부에 추가</button>
        </div>
        <div id="a-msg" style="font-size:12px;color:#E8828A;text-align:center"></div>
      </div>
    </div>
    <div id="drink-counter" class="dcbox hide"></div>
    <div id="list"></div>
  </div>
</div>
<script>
  var KEY="admin_key";
  function key(){ return localStorage.getItem(KEY)||""; }
  var records=[];
  function apiUrl(sort){ return "/api/airtable?table="+encodeURIComponent("로테이션 신청")+(sort?"&sort=신청일시":""); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // 🪑 테이블 번호 · ☕ 음료 카운터 (이 기기에 저장)
  function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"{}")||{}; }catch(e){ return {}; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  var TBL_KEY="att_tables", tableMap=lsGet(TBL_KEY);
  window.setTable=function(id,val){ val=(val||"").trim(); if(val) tableMap[id]=val; else delete tableMap[id]; lsSet(TBL_KEY,tableMap); };
  var DRINKS=["아이스 아메리카노","아이스티"];
  function drinkKey(){ return "att_drinks_"+curRound; }
  function autoDrink(d){ return records.filter(function(x){ return (x.fields||{})["음료선택"]===d; }).length; }
  function renderDrinkCounter(){
    var box=document.getElementById("drink-counter"); if(!box) return;
    if(!records.length){ box.classList.add("hide"); return; }
    box.classList.remove("hide");
    var stored=lsGet(drinkKey());
    box.innerHTML='<div class="dc-title">☕ 음료 카운터 <span class="dc-hint">− / + 로 조절 (이 기기에 저장)</span></div>'+
      DRINKS.map(function(d,i){
        var auto=autoDrink(d); var val=(d in stored)?stored[d]:auto;
        return '<div class="dc-row"><span class="dc-name">'+esc(d)+'</span>'+
          '<button class="dc-btn" onclick="dcAdj('+i+',-1)">−</button>'+
          '<span class="dc-num" id="dc-num-'+i+'">'+val+'</span>'+
          '<button class="dc-btn" onclick="dcAdj('+i+',1)">+</button>'+
          '<span class="dc-auto">신청 '+auto+'</span></div>';
      }).join("");
  }
  window.dcAdj=function(i,delta){
    var d=DRINKS[i]; var stored=lsGet(drinkKey());
    var cur=(d in stored)?stored[d]:autoDrink(d);
    cur=Math.max(0,cur+delta); stored[d]=cur; lsSet(drinkKey(),stored);
    var el=document.getElementById("dc-num-"+i); if(el) el.textContent=cur;
  };

  document.getElementById("loginBtn").addEventListener("click",doLogin);
  document.getElementById("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });
  function doLogin(){
    var pw=document.getElementById("pw").value;
    fetch("/api/admin-auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})})
      .then(function(r){return r.json();}).then(function(d){
        if(d.ok){ localStorage.setItem(KEY,pw); showConsole(); }
        else { document.getElementById("login-msg").textContent="비밀번호가 틀렸어요"; }
      }).catch(function(){ document.getElementById("login-msg").textContent="오류가 났어요. 다시 시도해주세요."; });
  }
  function showConsole(){ document.getElementById("login").classList.add("hide"); document.getElementById("console").classList.remove("hide"); load(); }
  if(key()){ showConsole(); }

  document.getElementById("refreshBtn").addEventListener("click",load);
  var allRecs=[], roundList=[], curRound="";
  function parseRoundKey(rd){ var m=String(rd||"").match(/(\d{1,2})\s*\/\s*(\d{1,2})/); return m?(parseInt(m[1])*100+parseInt(m[2])):0; }
  function load(){
    document.getElementById("list").innerHTML='<div class="spin"></div>';
    fetch(apiUrl(true),{headers:{"x-admin-key":key()}}).then(function(r){return r.json();}).then(function(r){
      if(r.error){ document.getElementById("list").innerHTML='<div class="empty">'+esc(r.error)+'<br>(비밀번호 확인 · 새로고침)</div>'; return; }
      allRecs=(r.records||[]).filter(function(x){ return (x.fields||{})["입금확정"]==="O"; });
      roundList=[];
      allRecs.forEach(function(x){ var rd=(x.fields||{})["회차"]; if(rd && roundList.indexOf(rd)<0) roundList.push(rd); });
      roundList.sort(function(a,b){ return parseRoundKey(b)-parseRoundKey(a); });
      if(!roundList.length) roundList=["8/27 (목)"];
      if(!curRound || roundList.indexOf(curRound)<0) curRound=roundList[0];
      renderTabs();
      render();
    }).catch(function(){ document.getElementById("list").innerHTML='<div class="empty">불러오기 오류</div>'; });
  }
  function renderTabs(){
    var t=document.getElementById("round-tabs"); if(!t) return; t.innerHTML="";
    roundList.forEach(function(rd){
      var b=document.createElement("button"); b.className="rtab"+(rd===curRound?" on":""); b.textContent=rd;
      b.addEventListener("click",function(){ curRound=rd; renderTabs(); render(); });
      t.appendChild(b);
    });
  }
  function render(){
    records=allRecs.filter(function(x){ return (x.fields||{})["회차"]===curRound; });
    var atRound=document.getElementById("at-round"); if(atRound) atRound.textContent=curRound;
    var present=records.filter(function(x){ return (x.fields||{})["출석"]==="O"; }).length;
    var m=records.filter(function(x){return (x.fields||{})["성별"]==="남성";}).length;
    var fw=records.filter(function(x){return (x.fields||{})["성별"]==="여성";}).length;
    document.getElementById("s-present").textContent=present;
    document.getElementById("s-all").textContent=records.length;
    document.getElementById("s-gender").textContent=m+" / "+fw;
    document.getElementById("cnt").textContent="출석 "+present+"/"+records.length+"명";
    renderDrinkCounter();
    var list=document.getElementById("list"); list.innerHTML="";
    if(!records.length){ list.innerHTML='<div class="empty">'+esc(curRound)+' 입금확정된 참가자가 아직 없어요.<br>rotation-admin에서 "💰 입금확인" 누르면 여기 떠요.</div>'; return; }

    function rowEl(x){
      var f=x.fields||{}, on=f["출석"]==="O";
      var el=document.createElement("div"); el.className="row"+(on?" present":"");
      var nick=f["닉네임"]?' <span style="font-size:11px;color:var(--muted);font-weight:600">('+esc(f["닉네임"])+')</span>':'';
      var drink=f["음료선택"]?' · ☕'+esc(f["음료선택"]):'';
      el.innerHTML='<div class="chk">✓</div><div style="flex:1;min-width:0"><div class="nm">'+esc(f["이름"]||f["닉네임"]||"?")+nick+'<span class="g">'+esc(f["성별"]||"")+(f["출생연도"]?" · "+esc(f["출생연도"])+"년생":"")+'</span></div><div class="meta">'+esc(f["연락처"]||"")+drink+'</div></div>'+
        '<input class="tbl-input" value="'+esc(tableMap[x.id]||"")+'" placeholder="테이블" onclick="event.stopPropagation()" onchange="setTable(\''+x.id+'\',this.value)">';
      el.addEventListener("click",function(){ toggle(x, el); });
      return el;
    }
    // 👦👧 남/여 2단 분리 (좁은 화면에선 자동으로 위아래로 쌓임)
    var males=records.filter(function(x){return (x.fields||{})["성별"]==="남성";});
    var females=records.filter(function(x){return (x.fields||{})["성별"]==="여성";});
    var etc=records.filter(function(x){var g=(x.fields||{})["성별"];return g!=="남성"&&g!=="여성";});
    function col(title,arr,color){
      var c=document.createElement("div"); c.style.cssText="flex:1 1 300px;min-width:280px";
      var pres=arr.filter(function(x){return (x.fields||{})["출석"]==="O";}).length;
      var h=document.createElement("div"); h.style.cssText="position:sticky;top:0;z-index:2;font-weight:900;font-size:13px;color:"+color+";background:var(--bg);padding:8px 11px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line-strong)";
      h.innerHTML=title+' <span style="color:var(--muted);font-weight:600;font-size:12px">출석 '+pres+'/'+arr.length+'</span>';
      c.appendChild(h);
      if(arr.length){ arr.forEach(function(x){ c.appendChild(rowEl(x)); }); }
      else { var e=document.createElement("div"); e.className="empty"; e.style.padding="18px 0"; e.textContent="없음"; c.appendChild(e); }
      return c;
    }
    var wrap=document.createElement("div"); wrap.style.cssText="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start";
    wrap.appendChild(col("👦 남성",males,"#7EA6E0"));
    wrap.appendChild(col("👧 여성",females,"#E88FB0"));
    list.appendChild(wrap);
    if(etc.length){ var ew=document.createElement("div"); ew.style.marginTop="12px"; etc.forEach(function(x){ ew.appendChild(rowEl(x)); }); list.appendChild(ew); }
  }
  // ➕ 현장 참가자 수기 추가 (문토 선결제 등 → 입금확정 상태로 명단에 올림)
  document.getElementById("addBtn").addEventListener("click",function(){
    var f=document.getElementById("add-form"); f.classList.toggle("hide");
    if(!f.classList.contains("hide")) document.getElementById("a-name").focus();
  });
  document.getElementById("a-cancel").addEventListener("click",function(){ document.getElementById("add-form").classList.add("hide"); });
  document.getElementById("a-save").addEventListener("click",addWalkin);
  function aval(id){ return (document.getElementById(id).value||"").trim(); }
  function addWalkin(){
    var name=aval("a-name"), gender=document.getElementById("a-gender").value;
    var msgEl=document.getElementById("a-msg");
    if(!name){ msgEl.textContent="이름을 입력해주세요."; return; }
    if(!gender){ msgEl.textContent="성별을 선택해주세요."; return; }
    var round=curRound||"8/27 (목)", np=aval("a-phone").replace(/[^0-9]/g,"");
    var dup=allRecs.filter(function(z){ var zf=z.fields||{}; var zp=String(zf["연락처"]||"").replace(/[^0-9]/g,"");
      if(np&&zp&&np===zp) return true;
      return (zf["이름"]||"")===name && (zf["성별"]||"")===gender && (zf["회차"]||"")===round; })[0];
    if(dup){ var df=dup.fields||{};
      if(!confirm("⚠️ 이미 명단에 있는 것 같아요:\n"+(df["이름"]||"")+" · "+(df["성별"]||"")+" · "+(df["회차"]||"")+"\n\n그래도 추가할까요? (중복될 수 있어요)")) return; }
    var fields={ "이름":name, "성별":gender, "회차":round, "승인상태":"승인", "입금확정":"O", "신청일시":new Date().toLocaleString("ko-KR") };
    var birth=aval("a-birth"); if(birth) fields["출생연도"]=birth;
    var phone=aval("a-phone"); if(phone) fields["연락처"]=phone;
    var drink=document.getElementById("a-drink").value; if(drink) fields["음료선택"]=drink;
    fields["유입경로"]="문토";
    var btn=document.getElementById("a-save"), orig=btn.textContent; btn.disabled=true; btn.textContent="추가 중…";
    function errText(e){ if(!e) return ""; if(typeof e==="string") return e; return e.message||e.type||JSON.stringify(e); }
    function tryPost(retried){
      fetch(apiUrl(false),{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key()},body:JSON.stringify({records:[{fields:fields}]})})
        .then(function(r){return r.json();}).then(function(r){
          if(r && r.error){
            if(!retried && ("유입경로" in fields)){ delete fields["유입경로"]; tryPost(true); return; }
            btn.disabled=false; btn.textContent=orig; msgEl.textContent="추가 실패: "+errText(r.error); return;
          }
          btn.disabled=false; btn.textContent=orig;
          ["a-name","a-birth","a-phone"].forEach(function(id){ document.getElementById(id).value=""; });
          document.getElementById("a-gender").value=""; document.getElementById("a-drink").selectedIndex=0; msgEl.textContent="";
          document.getElementById("add-form").classList.add("hide");
          load();
        }).catch(function(){ btn.disabled=false; btn.textContent=orig; msgEl.textContent="오류가 났어요. 다시 시도해주세요."; });
    }
    tryPost(false);
  }

  function toggle(x, el){
    var next=((x.fields||{})["출석"]==="O") ? "" : "O";
    x.fields["출석"]=next;
    render(); // 즉시 반영(체크 + 통계)
    fetch(apiUrl(false),{method:"PATCH",headers:{"Content-Type":"application/json","x-admin-key":key()},body:JSON.stringify({records:[{id:x.id,fields:{"출석":next}}]})})
      .then(function(r){return r.json();}).then(function(r){ if(r.error){ alert("저장 실패 — 다시 시도해주세요"); load(); } })
      .catch(function(){ alert("저장 중 오류"); load(); });
  }
</script>
</body>
