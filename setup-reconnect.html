<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>그때 그 사람 — Airtable 셋업 | 썸류센터 관리자</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{--bg:#0e0c0a;--surface:#161310;--surface-2:#1e1811;--ink:#F0E4D0;--muted:#9a8b73;--line-2:#3a2e1f;--amber:#E8B050;--ok:#6FBE97;--bad:#E07A7A;--ink-on:#171208}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:20px 15px 60px}
  h1{font-size:19px;font-weight:900;margin-bottom:6px}
  p.sub{font-size:13px;color:var(--muted);margin-bottom:18px}
  .card{background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:16px;margin-bottom:14px}
  input{width:100%;background:var(--surface-2);border:1.5px solid var(--line-2);border-radius:12px;padding:12px;font-size:14px;color:var(--ink);font-family:inherit}
  button{width:100%;border:none;border-radius:13px;padding:14px;font-size:14.5px;font-weight:900;background:var(--amber);color:var(--ink-on);cursor:pointer;font-family:inherit;margin-top:10px}
  button:disabled{opacity:.5}
  .log{font-size:12.5px;line-height:1.8;margin-top:12px;white-space:pre-wrap}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .dim{color:var(--muted)}
  ul{font-size:13px;color:var(--muted);padding-left:18px}
  a{color:var(--amber)}
</style>
</head>
<body>
<div class="wrap">
  <h1>💌 그때 그 사람 — Airtable 셋업</h1>
  <p class="sub">버튼 한 번으로 필요한 테이블·필드를 만들어요. 이미 있으면 건너뛰어요.</p>

  <div class="card" id="gate">
    <input id="pw" type="password" placeholder="관리자 비밀번호">
    <button onclick="unlock()">로그인</button>
    <div class="log" id="gate-msg"></div>
  </div>

  <div class="card" id="main" style="display:none">
    <div style="font-size:14px;font-weight:900;margin-bottom:8px">만들어질 것</div>
    <ul>
      <li><b>익명찾기</b> 테이블 (새로) — 다른 곳에서 만난 사람 글</li>
      <li><b>쪽지</b> 테이블 (새로) — 모든 쪽지</li>
      <li><b>회원</b> 테이블에 <b>쪽지권 · 신고누적 · 정지해제일</b> 필드</li>
      <li><b>1:1 매칭 신청</b> 테이블에 <b>쪽지연결</b> 필드</li>
    </ul>
    <button id="go" onclick="run()">🚀 한 번에 만들기</button>
    <div class="log" id="log"></div>
  </div>

  <div class="card" style="font-size:12.5px;color:var(--muted)">끝나면 <a href="reconnect.html">그때 그 사람 페이지</a>에서 바로 테스트할 수 있어요. · <a href="admin.html">관리자 홈</a></div>
</div>

<script>
  var K="admin_key";
  function key(){ try{ return localStorage.getItem(K)||""; }catch(e){ return ""; } }
  function show(){ document.getElementById("gate").style.display="none"; document.getElementById("main").style.display="block"; }
  if(key()) show();
  document.getElementById("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") unlock(); });
  function unlock(){
    var v=document.getElementById("pw").value;
    fetch("/api/admin-auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:v})})
      .then(function(r){return r.json();}).then(function(d){
        if(d.ok){ try{ localStorage.setItem(K,v); }catch(e){} show(); }
        else document.getElementById("gate-msg").textContent="비밀번호가 틀렸어요";
      });
  }

  function log(msg,cls){ var l=document.getElementById("log"); l.innerHTML+='<div class="'+(cls||"")+'">'+msg+'</div>'; }
  function api(body){
    return fetch("/api/member",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key()},body:JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(d){ d._ok=r.ok; return d; }); });
  }
  var T=function(n){ return {name:n,type:"singleLineText"}; };
  var L=function(n){ return {name:n,type:"multilineText"}; };
  var D=function(n){ return {name:n,type:"date",options:{dateFormat:{name:"iso"}}}; };
  var N=function(n){ return {name:n,type:"number",options:{precision:0}}; };
  var S=function(n,ch){ return {name:n,type:"singleSelect",options:{choices:ch.map(function(c){return {name:c};})}}; };

  var PLAN={
    tables:[
      { name:"익명찾기", description:"그날 그 사람 — 다른 곳 소개팅에서 만난 사람 찾기/셀소 글 (업체는 초성만 공개)",
        fields:[T("작성카카오ID"),S("유형",["찾기","셀소"]),T("업체"),D("날짜"),T("장소"),T("내호수"),T("내닉네임"),L("내묘사"),T("상대호수"),T("상대닉네임"),L("상대묘사"),L("하고싶은말"),T("확인질문"),S("상태",["공개","검토중","숨김"]),D("작성일"),N("응답수"),N("신고수"),L("신고자"),L("신고사유")] },
      { name:"쪽지", description:"그때 그 사람 쪽지 (썸류센터 회차 + 익명게시판). 수락 시 양쪽에 1:1 매칭 신청 링크 발송",
        fields:[T("보낸레코드ID"),T("보낸카카오ID"),T("보낸닉네임"),T("받는레코드ID"),T("받는닉네임"),T("회차"),L("내용"),T("확인답변"),S("상태",["대기","수락","거절","삭제"]),D("보낸날짜"),D("응답날짜"),L("신고사유")] }
    ],
    fields:[
      { table:"회원", field:N("쪽지권") },
      { table:"회원", field:N("신고누적") },
      { table:"회원", field:D("정지해제일") },
      { table:"1:1 매칭 신청", field:T("쪽지연결") }
    ]
  };

  async function run(){
    var btn=document.getElementById("go"); btn.disabled=true; document.getElementById("log").innerHTML="";
    try{
      var lt=await api({action:"listTables"});
      if(!lt._ok||!lt.tables){ log("테이블 목록을 못 읽었어요: "+(lt.error||JSON.stringify(lt)),"bad"); btn.disabled=false; return; }
      var byName={}; lt.tables.forEach(function(t){ byName[t.name]=t.id; });

      for(var i=0;i<PLAN.tables.length;i++){
        var t=PLAN.tables[i];
        if(byName[t.name]){ log("⏭ "+t.name+" 테이블 — 이미 있어요","dim"); continue; }
        var r=await api({action:"createTable",name:t.name,description:t.description,fields:t.fields});
        if(r._ok&&r.id){ byName[t.name]=r.id; log("✅ "+t.name+" 테이블 만들었어요 ("+t.fields.length+"개 필드)","ok"); }
        else log("❌ "+t.name+" 실패: "+((r.error&&(r.error.message||r.error))||JSON.stringify(r)),"bad");
      }
      for(var j=0;j<PLAN.fields.length;j++){
        var f=PLAN.fields[j];
        if(!byName[f.table]){ log("❌ "+f.table+" 테이블을 못 찾았어요","bad"); continue; }
        var r2=await api({action:"createField",tableId:byName[f.table],name:f.field.name,type:f.field.type,options:f.field.options});
        if(r2._ok&&r2.id) log("✅ "+f.table+" → "+f.field.name+" 필드 추가","ok");
        else if(r2.error&&/DUPLICATE|already exists|same name/i.test(JSON.stringify(r2.error))) log("⏭ "+f.table+" → "+f.field.name+" — 이미 있어요","dim");
        else log("❌ "+f.table+" → "+f.field.name+" 실패: "+((r2.error&&(r2.error.message||r2.error))||JSON.stringify(r2)),"bad");
      }
      log("\n끝! 이제 <a href='reconnect.html'>그때 그 사람</a>에서 테스트해보세요.","ok");
    }catch(e){ log("오류: "+e.message,"bad"); }
    btn.disabled=false;
  }
</script>
</body>
</html>
