<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7/24 재테크 미팅 참여자 현황 | 썸류센터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR',sans-serif;background:#0e0c0a;color:#f5f0ea;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  .y{color:#FFBE2E}
  ::selection{background:#FFBE2E;color:#000}

  nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);background:rgba(14,12,10,.8);border-bottom:1px solid rgba(255,255,255,.04);padding:14px 20px}
  .nav-inner{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
  .nav-inner img{height:28px}
  .nav-link{font-size:14px;font-weight:600;color:#9a9080;transition:color .2s}
  .nav-link:hover{color:#fff}

  main{max-width:600px;margin:0 auto;padding:40px 20px}

  .header{text-align:center;margin-bottom:40px}
  .header .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,190,46,.08);border:1px solid rgba(255,190,46,.18);color:#FFBE2E;padding:6px 16px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:16px}
  .header h1{font-size:24px;font-weight:900;line-height:1.3}
  .header .desc{font-size:14px;color:#9a9080;margin-top:8px;line-height:1.6}

  /* 현황 카운터 */
  .counter-row{display:flex;gap:12px;margin-bottom:32px}
  .counter-box{flex:1;background:#16140f;border:1px solid rgba(255,200,100,.06);border-radius:16px;padding:20px;text-align:center}
  .counter-box .emoji{font-size:28px;margin-bottom:8px}
  .counter-box .label{font-size:12px;color:#9a9080;font-weight:600}
  .counter-box .num{font-size:28px;font-weight:900;color:#FFBE2E;margin-top:4px}
  .counter-box .total{font-size:11px;color:#6b6358;margin-top:2px}

  /* 참여자 카드 */
  .member-card{background:#16140f;border:1px solid rgba(255,200,100,.06);border-radius:16px;padding:20px;margin-bottom:12px;transition:all .3s}
  .member-card:hover{border-color:rgba(255,190,46,.2);box-shadow:0 4px 20px rgba(255,190,46,.04)}
  .member-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .member-avatar{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .member-avatar.male{background:rgba(100,149,237,.1);border:1px solid rgba(100,149,237,.2)}
  .member-avatar.female{background:rgba(255,130,138,.1);border:1px solid rgba(255,130,138,.2)}
  .member-info{flex:1}
  .member-gender{font-size:13px;font-weight:700}
  .member-job{font-size:12px;color:#9a9080;margin-top:2px}
  .member-tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{display:inline-flex;align-items:center;gap:4px;background:rgba(255,190,46,.06);border:1px solid rgba(255,190,46,.12);color:#FFBE2E;padding:4px 12px;border-radius:100px;font-size:11px;font-weight:600}
  .member-appeal{font-size:13px;color:#b0a590;margin-top:10px;line-height:1.6;padding-top:10px;border-top:1px solid rgba(255,255,255,.04)}

  /* 섹션 타이틀 */
  .section-title{font-size:15px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}

  /* CTA */
  .cta-area{text-align:center;margin-top:40px;padding-top:32px;border-top:1px solid rgba(255,255,255,.04)}
  .cta-btn{display:inline-block;background:#FFBE2E;color:#000;font-weight:800;padding:16px 40px;border-radius:16px;font-size:15px;transition:all .2s}
  .cta-btn:hover{filter:brightness(.9);transform:translateY(-2px)}
  .cta-sub{font-size:12px;color:#6b6358;margin-top:12px}

  /* 빈자리 카드 */
  .empty-card{background:#16140f;border:2px dashed rgba(255,190,46,.15);border-radius:16px;padding:24px;text-align:center;margin-bottom:12px}
  .empty-card .emoji{font-size:24px;margin-bottom:8px}
  .empty-card p{font-size:13px;color:#6b6358}

  footer{border-top:1px solid rgba(255,255,255,.04);padding:32px 20px;text-align:center;margin-top:40px}
  footer img{height:20px;margin:0 auto 12px;display:block;opacity:.4}
  footer p{font-size:11px;color:#5a5248}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html"><img src="logo.png" alt="썸류센터"></a>
    <a href="fintech.html" class="nav-link"><i class="fa-solid fa-arrow-left" style="margin-right:4px"></i>모집요강</a>
  </div>
</nav>

<main>

  <div class="header">
    <span class="badge"><i class="fa-solid fa-chart-line"></i> 7/24 재테크 미팅</span>
    <h1>이런 분들이<br><span class="y">참가해요</span></h1>
    <p class="desc">승인된 참여자 프로필을 미리 확인해보세요</p>
  </div>

  <!-- 현황 카운터 -->
  <div class="counter-row">
    <div class="counter-box">
      <div class="emoji">🧑</div>
      <div class="label">남성</div>
      <div class="num">1</div>
      <div class="total">/ 8명 모집</div>
    </div>
    <div class="counter-box">
      <div class="emoji">👩</div>
      <div class="label">여성</div>
      <div class="num">0</div>
      <div class="total">/ 8명 모집</div>
    </div>
  </div>

  <!-- 남성 참여자 -->
  <div class="section-title"><span>🧑</span> 남성 참여자</div>

  <div class="member-card">
    <div class="member-top">
      <div class="member-avatar male">🧑</div>
      <div class="member-info">
        <div class="member-gender">남성</div>
        <div class="member-job">대기업 기획자</div>
      </div>
    </div>
    <div class="member-tags">
      <span class="tag"><i class="fa-solid fa-building-columns"></i> 부동산</span>
    </div>
    <div class="member-appeal">주 4회 임장 다녀요</div>
  </div>

  <div class="empty-card">
    <div class="emoji">📦</div>
    <p>빈자리 7개 — 설렘 배송 대기 중...</p>
  </div>

  <!-- 여성 참여자 -->
  <div class="section-title" style="margin-top:32px"><span>👩</span> 여성 참여자</div>

  <div class="empty-card">
    <div class="emoji">📦</div>
    <p>빈자리 8개 — 설렘 배송 대기 중...</p>
  </div>

  <!-- CTA -->
  <div class="cta-area">
    <p style="font-size:15px;font-weight:700;margin-bottom:16px">자리가 얼마 안 남았어요!</p>
    <a href="apply.html" class="cta-btn"><i class="fa-solid fa-chart-line" style="margin-right:6px"></i>나도 신청하기</a>
    <p class="cta-sub">승인제 · 확정 문자 별도 안내</p>
  </div>

</main>

<footer>
  <img src="logo.png" alt="썸류센터">
  <p>문의: 카카오톡 채널 @썸류센터</p>
</footer>

</body>
</html>
