<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>그때 그 사람 | 썸류센터</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{--bg:#0e0c0a;--surface:#161310;--surface-2:#1e1811;--ink:#F0E4D0;--muted:#9a8b73;--faint:#6a5c4c;--line:#2a2117;--line-2:#3a2e1f;--amber:#E8B050;--gold:#FFD37A;--ok:#6FBE97;--bad:#E07A7A;--ink-on:#171208;--female:#E88FB0;--male:#7EA6E0;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:520px;margin:0 auto;padding:18px 15px 70px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .top .h{font-size:19px;font-weight:900}
  .top a{font-size:12px;color:var(--muted);font-weight:700;margin-left:10px}
  .hero{background:linear-gradient(135deg,rgba(232,176,80,.14),rgba(232,143,176,.06));border:1px solid var(--line-2);border-radius:18px;padding:18px;margin-bottom:16px}
  .hero h2{font-size:20px;font-weight:900;line-height:1.35}
  .hero p{font-size:13px;color:var(--muted);margin-top:8px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:14px}
  .ch{font-size:15px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
  .ch small{font-size:11.5px;color:var(--muted);font-weight:600}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}
  .tab.on{background:var(--amber);color:var(--ink-on);border-color:var(--amber)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:7px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer}
  .chip.on{color:var(--gold);border-color:var(--amber);background:rgba(232,176,80,.12)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pp{background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:14px 12px;text-align:center}
  .pp .av{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:22px;background:rgba(232,176,80,.1)}
  .pp .nm{font-weight:900;font-size:14.5px}
  .pp .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .pp button{margin-top:10px;width:100%;border:none;border-radius:10px;padding:9px;font-size:12.5px;font-weight:900;background:var(--amber);color:var(--ink-on);cursor:pointer;font-family:inherit}
  .pp button:disabled{background:var(--line-2);color:var(--muted)}
  .gd{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px}
  .gd.f{color:var(--female);background:rgba(232,143,176,.13)} .gd.m{color:var(--male);background:rgba(126,166,224,.13)}
  .note{background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:14px;margin-bottom:10px}
  .note .meta{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:6px}
  .note .who{font-weight:900;font-size:14px}
  .note .txt{font-size:13.5px;white-space:pre-wrap;margin:6px 0 10px}
  .st{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
  .st.wait{color:var(--gold);background:rgba(232,176,80,.12)} .st.ok{color:var(--ok);background:rgba(111,190,151,.14)} .st.no{color:var(--muted);background:var(--line)}
  .row{display:flex;gap:8px}
  .btn{flex:1;border:none;border-radius:11px;padding:11px;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit}
  .btn.p{background:var(--amber);color:var(--ink-on)} .btn.g{background:var(--surface);border:1px solid var(--line-2);color:var(--muted)}
  .contact{margin-top:8px;font-size:13px;font-weight:800;color:var(--ok);background:rgba(111,190,151,.1);border-radius:10px;padding:9px 12px}
  .empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px}
  input,textarea{width:100%;background:var(--surface-2);border:1.5px solid var(--line-2);border-radius:12px;padding:12px;font-size:14px;color:var(--ink);font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--amber)}
  textarea{line-height:1.6;resize:vertical;min-height:96px}
  .save{width:100%;border:none;border-radius:13px;padding:14px;font-size:14.5px;font-weight:900;background:var(--amber);color:var(--ink-on);cursor:pointer;font-family:inherit;margin-top:10px}
  .save:disabled{opacity:.5}
  .msg{font-size:12.5px;text-align:center;margin-top:9px;min-height:16px;color:var(--muted)}
  .spin{width:26px;height:26px;border:3px solid var(--line-2);border-top-color:var(--amber);border-radius:50%;margin:44px auto;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.on{display:flex}
  .sheet{background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px 28px;width:100%;max-width:520px;border-top:1px solid var(--line-2)}
  .sheet h3{font-size:16px;font-weight:900;margin-bottom:4px}
  .sheet p{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .cnt{font-size:11px;color:var(--faint);text-align:right;margin-top:4px}
  .rule{font-size:11.5px;color:var(--faint);line-height:1.7;margin-top:14px}
  .post{background:var(--surface-2);border:1px solid var(--line-2);border-radius:16px;padding:15px;margin-bottom:11px}
  .post .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .post .co{font-weight:900;font-size:14.5px}
  .post .wh{font-size:12px;color:var(--muted);margin-top:2px}
  .post .lb{font-size:11px;font-weight:800;color:var(--gold);margin-top:10px}
  .post .bd{font-size:13.5px;white-space:pre-wrap}
  .post .ft{display:flex;gap:8px;margin-top:12px;align-items:center}
  .post .ft button{border:none;border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:900;cursor:pointer;font-family:inherit}
  .post .ft .me{background:var(--amber);color:var(--ink-on);flex:1}
  .post .ft .me:disabled{background:var(--line-2);color:var(--muted)}
  .post .ft .rp{background:transparent;color:var(--faint);font-size:11.5px;font-weight:700;padding:10px 6px}
  .pill{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(232,176,80,.12);color:var(--gold);white-space:nowrap}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12.5px;font-weight:800;color:var(--gold);margin-bottom:5px}
  .fld small{color:var(--faint);font-weight:600}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .newbtn{width:100%;border:1.5px dashed var(--line-2);background:transparent;color:var(--amber);border-radius:14px;padding:13px;font-weight:900;font-size:13.5px;cursor:pointer;font-family:inherit;margin-bottom:14px}
  .ticket{background:rgba(232,176,80,.08);border:1px solid var(--line-2);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .ticket b{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="h">💌 그때 그 사람</div>
    <div><a href="index.html">🏠 홈</a><a href="my.html">내 프로필</a></div>
  </div>

  <div class="hero">
    <h2>소개팅 그날, 번호 못 물어본 사람<br>지금 물어볼래요?</h2>
    <p>썸류센터 회차든, 다른 곳 소개팅이든. 쪽지를 보내고 상대가 수락하면, 두 분 모두 1:1 매칭 신청 후 센터장이 확인하고 연결해드려요. 연락처는 서로 공개되지 않아요.</p>
  </div>

  <div id="content"><div class="spin"></div></div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="m-title">쪽지 보내기</h3>
    <p id="m-sub"></p>
    <textarea id="m-text" maxlength="300" placeholder="그날 어떤 얘기가 좋았는지, 한 줄이면 충분해요 :)"></textarea>
    <div class="cnt"><span id="m-len">0</span>/300</div>
    <div class="fld" id="m-phone-w" style="display:none;margin-top:10px"><label>내 연락처 <small>· 상대에게 공개 안 돼요. 알림·연결용</small></label><input id="m-phone" type="tel" inputmode="numeric" placeholder="01012345678"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn g" onclick="closeModal()">취소</button>
      <button class="btn p" id="m-send" onclick="sendNote()">보내기</button>
    </div>
    <div class="msg" id="m-msg"></div>
  </div>
</div>

<script>
  var user=null;
  try{ user=JSON.parse(localStorage.getItem("ssumUser")||"null"); }catch(e){}
  var KID=user&&user.id?user.id:"";
  var me=null, tab="board", curRound="", people=[], posts=[], target=null, mode="rot";
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function api(action,extra){
    var b=Object.assign({action:action,kakaoId:KID},extra||{});
    return fetch("/api/member",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})
      .then(function(r){ return r.json().then(function(d){ d._status=r.status; return d; }); });
  }
  var CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  function chosung(t){ return String(t||"").split("").map(function(c){ var k=c.charCodeAt(0); return (k>=0xAC00&&k<=0xD7A3)?CHO[Math.floor((k-0xAC00)/588)]:c; }).join(""); }
  function needLogin(){ location.href="login.html?redirect=reconnect.html"; }
  function gdTag(g){ return g==="여성"?'<span class="gd f">여</span>':(g==="남성"?'<span class="gd m">남</span>':''); }

  async function load(){
    if(KID){ me=await api("rc_me"); if(me&&me.ok&&me.linked) curRound=me.rounds[0]||""; }
    render();
  }

  function render(){
    var h='<div class="tabs">'+
      '<div class="tab'+(tab==="board"?" on":"")+'" onclick="setTab(\'board\')">다른 곳에서 만난 사람</div>'+
      '<div class="tab'+(tab==="find"?" on":"")+'" onclick="setTab(\'find\')">썸류센터 회차</div>'+
      '<div class="tab'+(tab==="box"?" on":"")+'" onclick="setTab(\'box\')">쪽지함</div></div>';
    h+='<div id="panel"><div class="spin"></div></div>';
    $("content").innerHTML=h;
    if(tab==="find") renderFind(); else if(tab==="board") renderBoard(); else renderBox();
  }
  function setTab(t){ tab=t; render(); }

  /* ===== 썸류센터 회차 ===== */
  function renderLink(){
    $("panel").innerHTML=
      '<div class="card"><div class="ch">참가 기록을 먼저 연결해주세요</div>'+
      '<p style="font-size:13px;color:var(--muted);margin-bottom:12px">썸류센터 로테이션 소개팅 신청할 때 적었던 전화번호를 입력하면 내 참가 기록과 연결돼요.</p>'+
      '<input id="phone" type="tel" placeholder="01012345678" inputmode="numeric">'+
      '<button class="save" onclick="linkPhone()">연결하기</button><div class="msg" id="link-msg"></div></div>'+
      '<div class="rule">· 참가(입금 확정)한 회차가 있어야 사용할 수 있어요<br>· 아직 참여한 적 없다면 <a href="rotation.html" style="color:var(--amber);font-weight:800">다음 회차 신청하기 →</a><br>· 다른 곳 소개팅에서 만난 분은 <a href="javascript:setTab(\'board\')" style="color:var(--amber);font-weight:800">왼쪽 탭</a>에서 찾아보세요</div>';
  }
  async function linkPhone(){
    var p=($("phone").value||"").replace(/[^0-9]/g,"");
    if(p.length<9){ $("link-msg").textContent="전화번호를 정확히 입력해주세요"; return; }
    $("link-msg").textContent="연결 중...";
    try{
      var r=await fetch("/api/airtable?claim=1&kakaoId="+encodeURIComponent(KID),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:p})});
      var d=await r.json();
      if(!r.ok){ $("link-msg").textContent=d.error||"연결 실패"; return; }
      me=await api("rc_me");
      if(me.linked){ curRound=me.rounds[0]||""; renderFind(); }
      else $("link-msg").textContent="이 번호로 참가(입금 확정)한 기록이 없어요. 신청할 때 쓴 번호가 맞는지 확인해주세요.";
    }catch(e){ $("link-msg").textContent="오류가 났어요. 다시 시도해주세요"; }
  }
  async function renderFind(){
    if(!KID){ $("panel").innerHTML='<div class="card"><div class="empty">카카오 로그인 후 이용할 수 있어요<br><br><button class="save" onclick="needLogin()">카카오로 로그인</button></div></div>'; return; }
    if(!me||!me.ok){ $("panel").innerHTML='<div class="empty">'+esc((me&&me.error)||"불러오기 실패")+'</div>'; return; }
    if(!me.linked){ renderLink(); return; }
    var h='<div class="card"><div class="ch">내가 참여한 회차 <small>'+esc(me.nickname)+' '+gdTag(me.gender)+'</small></div><div class="chips">';
    me.rounds.forEach(function(r){ h+='<div class="chip'+(r===curRound?" on":"")+'" onclick="pickRound(\''+esc(r).replace(/'/g,"")+'\')">'+esc(r)+'</div>'; });
    h+='</div><div id="people"><div class="spin"></div></div></div>';
    h+='<div class="rule">· 쪽지는 하루 3개까지 보낼 수 있어요<br>· 상대가 수락하면 두 분께 1:1 매칭 신청 링크가 가고, 센터장이 확인 후 연결해드려요 (연락처 비공개). 거절하면 상대는 알 수 없어요<br>· 같은 분께는 한 번만 보낼 수 있어요</div>';
    $("panel").innerHTML=h;
    var d=await api("rc_people",{round:curRound});
    if(!d.ok){ $("people").innerHTML='<div class="empty">'+esc(d.error||"불러오기 실패")+'</div>'; return; }
    people=d.people||[];
    if(!people.length){ $("people").innerHTML='<div class="empty">이 회차 참가자 정보가 아직 없어요</div>'; return; }
    var g='<div class="grid">';
    people.forEach(function(p,i){
      var av=p.gender==="여성"?"🙋‍♀️":"🙋‍♂️";
      var btn=p.sent?'<button disabled>'+(p.sent==="수락"?"수락됨 🎉":(p.sent==="거절"?"답장 없음":"보냈어요 ✓"))+'</button>':'<button onclick="openModal(\'rot\','+i+')">쪽지 보내기</button>';
      g+='<div class="pp"><div class="av">'+av+'</div><div class="nm">'+esc(p.nickname)+'</div><div class="sub">'+(p.birth?esc(p.birth)+'년생 · ':'')+esc(p.round)+'</div>'+btn+'</div>';
    });
    $("people").innerHTML=g+'</div>';
  }
  function pickRound(r){ curRound=r; renderFind(); }

  /* ===== 익명 게시판: 다른 곳에서 만난 사람 ===== */
  async function renderBoard(){
    var h='<button class="newbtn" onclick="openPostForm()">✍️ 그날 그 사람 찾는 글 쓰기</button>';
    h+='<div id="postform"></div><div id="posts"><div class="spin"></div></div>';
    h+='<div class="rule">· 어느 업체 소개팅이든 올릴 수 있어요. 업체명은 초성으로만 공개되고, 그날 번호(여 3호 등)·닉네임·한 줄 인상으로 찾아요<br>· 이름·전화번호·SNS·자세한 묘사는 올릴 수 없어요<br>· "저예요!" 쪽지는 <b style="color:var(--gold)">첫 1회 무료</b>, 두 번째부터는 쪽지권(1,000원)이 필요해요<br>· 상대가 수락하면 두 분께 1:1 매칭 신청 링크가 가고, 센터장이 신원 확인 후 연결해드려요 (연락처 비공개) · 부적절한 글은 신고 3회면 자동으로 내려가요</div>';
    h+='<div class="card" style="margin-top:14px;text-align:center"><div style="font-size:14px;font-weight:900">아직 못 찾았어요?</div><div style="font-size:12.5px;color:var(--muted);margin:4px 0 10px">썸류센터 다음 회차에서 새 인연을 만나보세요</div><a href="rotation.html" class="save" style="display:block;text-decoration:none;text-align:center">썸류센터 소개팅 보러가기 →</a></div>';
    $("panel").innerHTML=h;
    var d=await api("bd_list");
    if(!d.ok){ $("posts").innerHTML='<div class="empty">'+esc(d.error||"불러오기 실패")+'</div>'; return; }
    posts=d.posts||[];
    if(!posts.length){ $("posts").innerHTML='<div class="empty">아직 올라온 글이 없어요.<br>첫 번째로 그날 그 사람을 찾아보세요!</div>'; return; }
    var g='';
    posts.forEach(function(p,i){
      var btn;
      if(p.mine) btn='<button class="me" disabled>내가 쓴 글</button><button class="rp" onclick="hidePost(\''+p.id+'\')">내리기</button>';
      else if(p.sent) btn='<button class="me" disabled>'+(p.sent==="수락"?"수락됨 🎉":(p.sent==="거절"?"답장 없음":"쪽지 보냈어요 ✓"))+'</button>';
      else btn='<button class="me" onclick="openModal(\'board\','+i+')">👋 저예요!</button><button class="rp" onclick="reportPost(\''+p.id+'\')">신고</button>';
      g+='<div class="post"><div class="hd"><div><div class="co">'+esc(p.company)+' <span style="font-size:10.5px;color:var(--faint);font-weight:600">초성</span></div><div class="wh">'+esc(p.date)+' · '+esc(p.place)+'</div></div><span class="pill">저예요 '+(p.replies||0)+'</span></div>';
      function who(no,nick,desc){ var parts=[]; if(no) parts.push('<b>'+esc(no)+'</b>'); if(nick) parts.push('닉네임 <b>'+esc(nick)+'</b>'); var head=parts.join(' · '); return '<div class="bd">'+head+(head&&desc?'<br>':'')+esc(desc)+'</div>'; }
      if(p.meNo||p.meNick||p.me) g+='<div class="lb">저는</div>'+who(p.meNo,p.meNick,p.me);
      g+='<div class="lb">찾는 분</div>'+who(p.youNo,p.youNick,p.you);
      if(p.msg) g+='<div class="lb">하고 싶은 말</div><div class="bd">'+esc(p.msg)+'</div>';
      g+='<div class="ft">'+btn+'</div></div>';
    });
    $("posts").innerHTML=g;
  }
  function openPostForm(){
    if(!KID){ needLogin(); return; }
    var today=new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);
    $("postform").innerHTML='<div class="card">'+
      '<div class="ch">그날 그 사람 찾기</div>'+
      '<div class="two"><div class="fld"><label>어디 소개팅? <small>· 초성으로만 공개돼요</small></label><input id="f-co" maxlength="30" placeholder="예: 썸류센터" oninput="$(\'f-co-prev\').textContent=this.value?\'공개될 이름: \'+chosung(this.value):\'\'"><div id="f-co-prev" style="font-size:11px;color:var(--gold);margin-top:4px;min-height:14px"></div></div>'+
      '<div class="fld"><label>날짜</label><input id="f-dt" type="date" max="'+today+'"></div></div>'+
      '<div class="fld"><label>장소 <small>· 동네 정도만</small></label><input id="f-pl" maxlength="20" placeholder="예: 강남역"></div>'+
      '<div class="fld"><label>저는</label><div class="two" style="grid-template-columns:1fr 1fr 1.4fr">'+
        '<select id="f-mg" style="width:100%;background:var(--surface-2);border:1.5px solid var(--line-2);border-radius:12px;padding:12px;font-size:14px;color:var(--ink);font-family:inherit"><option value="">성별</option><option value="남">남자</option><option value="여">여자</option></select>'+
        '<input id="f-mn" type="number" inputmode="numeric" min="1" max="99" placeholder="몇 호"><input id="f-mk" maxlength="12" placeholder="그날 닉네임"></div>'+
        '<input id="f-me" maxlength="60" placeholder="한 줄 인상 · 예: 검정 니트, 러닝 얘기" style="margin-top:8px"></div>'+
      '<div class="fld"><label>찾는 분</label><div class="two">'+
        '<input id="f-yn" type="number" inputmode="numeric" min="1" max="99" placeholder="몇 호"><input id="f-yk" maxlength="12" placeholder="그날 닉네임"></div>'+
        '<input id="f-you" maxlength="80" placeholder="한 줄 인상 · 예: 베이지 코트, 제주 한달살기" style="margin-top:8px"></div>'+
      '<div class="fld"><label>하고 싶은 말 <small>· 선택</small></label><textarea id="f-msg" maxlength="200" style="min-height:70px" placeholder="그때 번호 못 물어봐서 아쉬웠어요"></textarea></div>'+
      '<div class="fld"><label>내 연락처 <small>· 상대에게 공개 안 돼요. 알림·연결용</small></label><input id="f-ph" type="tel" inputmode="numeric" placeholder="01012345678"></div>'+
      '<div class="rule" style="margin:0 0 12px">번호·닉네임·짧은 인상만 적어주세요. 실명·전화번호·SNS·너무 자세한 묘사는 올라가지 않아요.</div>'+
      '<div class="row"><button class="btn g" onclick="$(\'postform\').innerHTML=\'\'">취소</button><button class="btn p" id="f-save" onclick="submitPost()">올리기</button></div><div class="msg" id="f-msg-out"></div></div>';
    $("f-co").focus();
  }
  async function submitPost(){
    var b={company:$("f-co").value,date:$("f-dt").value,place:$("f-pl").value,myGender:$("f-mg").value,meNo:$("f-mn").value,meNick:$("f-mk").value,me:$("f-me").value,youNo:$("f-yn").value,youNick:$("f-yk").value,you:$("f-you").value,msg:$("f-msg").value,phone:$("f-ph").value};
    $("f-save").disabled=true; $("f-msg-out").textContent="올리는 중...";
    var d=await api("bd_post",b);
    if(!d.ok){ $("f-msg-out").textContent=d.error||"실패"; $("f-save").disabled=false; return; }
    $("postform").innerHTML=''; renderBoard();
  }
  async function hidePost(id){ if(!confirm("이 글을 내릴까요?")) return; var d=await api("bd_hide",{postId:id}); if(!d.ok){alert(d.error||"실패");return;} renderBoard(); }
  async function reportPost(id){ if(!KID){ needLogin(); return; } if(!confirm("이 글을 신고할까요? (실명·연락처 노출, 비방 등)")) return; var d=await api("bd_report",{postId:id}); alert(d.ok?"신고했어요. 확인 후 조치할게요":(d.error||"실패")); }

  /* ===== 쪽지함 ===== */
  async function renderBox(){
    if(!KID){ $("panel").innerHTML='<div class="card"><div class="empty">카카오 로그인 후 이용할 수 있어요<br><br><button class="save" onclick="needLogin()">카카오로 로그인</button></div></div>'; return; }
    var items=[], remaining=null, bd=await api("bd_inbox");
    if(bd.ok) items=items.concat(bd.items||[]);
    if(me&&me.ok&&me.linked){ var rc=await api("rc_inbox"); if(rc.ok){ items=items.concat(rc.items||[]); remaining=rc.remaining; } }
    items.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
    var recv=items.filter(function(x){return x.dir==="received";}), sent=items.filter(function(x){return x.dir==="sent";});
    var h='';
    if(bd.ok) h+='<div class="ticket">익명 게시판 "저예요" 쪽지: '+(bd.freeLeft?'<b>무료 1회 남음</b>':'무료 사용함')+' · 쪽지권 <b>'+bd.tickets+'장</b>'+(bd.freeLeft||bd.tickets?'':' — <a href="https://pf.kakao.com/_AxfxcVX" target="_blank" rel="noopener" style="color:var(--amber);font-weight:800">쪽지권 구매 (카톡 채널) →</a>')+'</div>';
    h+='<div class="card"><div class="ch">받은 쪽지 <small>'+recv.length+'개</small></div>';
    if(!recv.length) h+='<div class="empty">아직 받은 쪽지가 없어요</div>';
    recv.forEach(function(n){ h+=noteHtml(n,true); });
    h+='</div><div class="card"><div class="ch">보낸 쪽지 '+(remaining!=null?'<small>썸류센터 회차 쪽지 오늘 '+remaining+'개 가능</small>':'')+'</div>';
    if(!sent.length) h+='<div class="empty">아직 보낸 쪽지가 없어요</div>';
    sent.forEach(function(n){ h+=noteHtml(n,false); });
    h+='</div>';
    $("panel").innerHTML=h;
  }
  function stTag(s){ return s==="수락"?'<span class="st ok">수락</span>':(s==="거절"?'<span class="st no">거절</span>':'<span class="st wait">답장 대기</span>'); }
  function noteHtml(n,isRecv){
    var h='<div class="note"><div class="meta"><span>'+(n.board?'📋 ':'☕ ')+esc(n.round)+' · '+esc(n.date)+'</span>'+stTag(n.status)+'</div>';
    h+='<div class="who">'+(isRecv?esc(n.from)+(n.board?' 쪽지가 왔어요':'님이 보냄'):(n.to?esc(n.to)+'님에게':'보낸 쪽지'))+'</div><div class="txt">'+esc(n.text)+'</div>';
    if(isRecv&&n.status==="대기") h+='<div class="row"><button class="btn g" onclick="respond(\''+n.id+'\',\'거절\','+(n.board?'true':'false')+')">괜찮아요</button><button class="btn p" onclick="respond(\''+n.id+'\',\'수락\','+(n.board?'true':'false')+')">수락하기</button></div>';
    if(n.status==="수락") h+='<div class="contact">🎉 수락됐어요! 두 분 모두 1:1 매칭 신청서를 작성하면 센터장이 확인 후 연결해드려요<br><a href="matching.html?ref=reconnect&note='+esc(n.id)+'" style="color:var(--ok);text-decoration:underline;font-weight:900">1:1 매칭 신청서 작성하기 →</a></div>';
    return h+'</div>';
  }
  async function respond(id,ans,isBoard){
    if(ans==="수락"&&!confirm("수락하면 두 분 모두 1:1 매칭 신청서를 작성하고, 센터장이 확인 후 연결해드려요. 괜찮을까요?")) return;
    var d=await api(isBoard?"bd_respond":"rc_respond",{noteId:id,answer:ans});
    if(!d.ok){ alert(d.error||"처리 실패"); return; }
    renderBox();
  }

  /* ===== 쪽지 모달 ===== */
  function openModal(m,i){
    if(!KID){ needLogin(); return; }
    mode=m; target=(m==="rot"?people:posts)[i]; if(!target) return;
    if(m==="rot"){ $("m-title").textContent=target.nickname+"님께 쪽지"; $("m-sub").textContent=curRound+" 소개팅에서 만난 분이에요. 상대가 수락하면 센터장이 연결해드려요."; $("m-phone-w").style.display="none"; }
    else { $("m-title").textContent="👋 저예요!"; $("m-sub").textContent=target.company+" "+target.date+" 글쓴이에게 보내요. 첫 쪽지는 무료, 두 번째부터는 쪽지권이 필요해요."; $("m-phone-w").style.display="block"; $("m-phone").value=""; }
    $("m-text").value=""; $("m-len").textContent="0"; $("m-msg").textContent=""; $("m-send").disabled=false;
    $("modal").classList.add("on"); $("m-text").focus();
  }
  function closeModal(){ $("modal").classList.remove("on"); }
  $("m-text").addEventListener("input",function(){ $("m-len").textContent=this.value.length; });
  async function sendNote(){
    var t=($("m-text").value||"").trim();
    if(!t){ $("m-msg").textContent="내용을 입력해주세요"; return; }
    $("m-send").disabled=true; $("m-msg").textContent="보내는 중...";
    var d;
    if(mode==="rot") d=await api("rc_send",{toId:target.id,round:curRound,text:t});
    else d=await api("bd_reply",{postId:target.id,text:t,phone:$("m-phone").value});
    if(!d.ok){
      if(d.needTicket){ $("m-msg").innerHTML='첫 쪽지는 무료, 두 번째부터는 쪽지권(1,000원)이 필요해요.<br><a href="https://pf.kakao.com/_AxfxcVX" target="_blank" rel="noopener" style="color:var(--amber);font-weight:800">카톡 채널에서 쪽지권 구매 →</a>'; }
      else $("m-msg").textContent=d.error||"전송 실패";
      $("m-send").disabled=false; return;
    }
    $("m-msg").textContent=mode==="rot"?("보냈어요! 오늘 "+d.remaining+"개 더 보낼 수 있어요"):(d.usedTicket?"보냈어요! 쪽지권 1장을 사용했어요":"보냈어요! (무료 1회 사용)");
    setTimeout(function(){ closeModal(); if(mode==="rot") renderFind(); else renderBoard(); },900);
  }
  $("modal").addEventListener("click",function(e){ if(e.target===this) closeModal(); });

  load();
</script>
</body>
</html>
