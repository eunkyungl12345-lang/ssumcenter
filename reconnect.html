<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>그때 그 사람 | 썸류센터</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{--bg:#0e0c0a;--surface:#161310;--surface-2:#1e1811;--ink:#F0E4D0;--muted:#9a8b73;--faint:#6a5c4c;--line:#2a2117;--line-2:#3a2e1f;--amber:#E8B050;--gold:#FFD37A;--ok:#6FBE97;--bad:#E07A7A;--ink-on:#171208;--female:#E88FB0;--male:#7EA6E0;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:520px;margin:0 auto;padding:18px 15px 70px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .top .h{font-size:19px;font-weight:900}
  .top a{font-size:12px;color:var(--muted);font-weight:700;margin-left:10px}
  .hero{background:linear-gradient(135deg,rgba(232,176,80,.14),rgba(232,143,176,.06));border:1px solid var(--line-2);border-radius:18px;padding:18px;margin-bottom:16px}
  .hero h2{font-size:20px;font-weight:900;line-height:1.35}
  .hero p{font-size:13px;color:var(--muted);margin-top:8px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:14px}
  .ch{font-size:15px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
  .ch small{font-size:11.5px;color:var(--muted);font-weight:600}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}
  .tab.on{background:var(--amber);color:var(--ink-on);border-color:var(--amber)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:7px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer}
  .chip.on{color:var(--gold);border-color:var(--amber);background:rgba(232,176,80,.12)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pp{background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:14px 12px;text-align:center}
  .pp .av{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:22px;background:rgba(232,176,80,.1)}
  .pp .nm{font-weight:900;font-size:14.5px}
  .pp .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .pp button{margin-top:10px;width:100%;border:none;border-radius:10px;padding:9px;font-size:12.5px;font-weight:900;background:var(--amber);color:var(--ink-on);cursor:pointer;font-family:inherit}
  .pp button:disabled{background:var(--line-2);color:var(--muted)}
  .gd{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px}
  .gd.f{color:var(--female);background:rgba(232,143,176,.13)} .gd.m{color:var(--male);background:rgba(126,166,224,.13)}
  .note{background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:14px;margin-bottom:10px}
  .note .meta{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:6px}
  .note .who{font-weight:900;font-size:14px}
  .note .txt{font-size:13.5px;white-space:pre-wrap;margin:6px 0 10px}
  .st{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
  .st.wait{color:var(--gold);background:rgba(232,176,80,.12)} .st.ok{color:var(--ok);background:rgba(111,190,151,.14)} .st.no{color:var(--muted);background:var(--line)}
  .row{display:flex;gap:8px}
  .btn{flex:1;border:none;border-radius:11px;padding:11px;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit}
  .btn.p{background:var(--amber);color:var(--ink-on)} .btn.g{background:var(--surface);border:1px solid var(--line-2);color:var(--muted)}
  .contact{margin-top:8px;font-size:13px;font-weight:800;color:var(--ok);background:rgba(111,190,151,.1);border-radius:10px;padding:9px 12px}
  .empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px}
  input,textarea{width:100%;background:var(--surface-2);border:1.5px solid var(--line-2);border-radius:12px;padding:12px;font-size:14px;color:var(--ink);font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--amber)}
  textarea{line-height:1.6;resize:vertical;min-height:96px}
  .save{width:100%;border:none;border-radius:13px;padding:14px;font-size:14.5px;font-weight:900;background:var(--amber);color:var(--ink-on);cursor:pointer;font-family:inherit;margin-top:10px}
  .save:disabled{opacity:.5}
  .msg{font-size:12.5px;text-align:center;margin-top:9px;min-height:16px;color:var(--muted)}
  .spin{width:26px;height:26px;border:3px solid var(--line-2);border-top-color:var(--amber);border-radius:50%;margin:44px auto;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.on{display:flex}
  .sheet{background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px 28px;width:100%;max-width:520px;border-top:1px solid var(--line-2)}
  .sheet h3{font-size:16px;font-weight:900;margin-bottom:4px}
  .sheet p{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .cnt{font-size:11px;color:var(--faint);text-align:right;margin-top:4px}
  .rule{font-size:11.5px;color:var(--faint);line-height:1.7;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="h">💌 그때 그 사람</div>
    <div><a href="index.html">🏠 홈</a><a href="my.html">내 프로필</a></div>
  </div>

  <div class="hero">
    <h2>소개팅 그날, 번호 못 물어본 사람<br>지금 물어볼래요?</h2>
    <p>참여했던 회차에서 만난 분께 쪽지를 보낼 수 있어요. 상대가 수락해야만 서로 연락처가 열려요.</p>
  </div>

  <div id="content"><div class="spin"></div></div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="m-title">쪽지 보내기</h3>
    <p id="m-sub"></p>
    <textarea id="m-text" maxlength="300" placeholder="그날 어떤 얘기가 좋았는지, 한 줄이면 충분해요 :)"></textarea>
    <div class="cnt"><span id="m-len">0</span>/300</div>
    <div class="row" style="margin-top:12px">
      <button class="btn g" onclick="closeModal()">취소</button>
      <button class="btn p" id="m-send" onclick="sendNote()">보내기</button>
    </div>
    <div class="msg" id="m-msg"></div>
  </div>
</div>

<script>
  var user=null;
  try{ user=JSON.parse(localStorage.getItem("ssumUser")||"null"); }catch(e){}
  if(!user||!user.id){ location.replace("login.html?redirect=reconnect.html"); }
  var KID=user?user.id:"";
  var me=null, tab="find", curRound="", people=[], inbox=null, target=null;
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function api(action,extra){
    var b=Object.assign({action:action,kakaoId:KID},extra||{});
    return fetch("/api/member",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})
      .then(function(r){ return r.json().then(function(d){ d._status=r.status; return d; }); });
  }

  function gdTag(g){ return g==="여성"?'<span class="gd f">여</span>':(g==="남성"?'<span class="gd m">남</span>':''); }

  async function load(){
    me=await api("rc_me");
    if(!me.ok){ $("content").innerHTML='<div class="empty">'+esc(me.error||"불러오기 실패")+'</div>'; return; }
    if(!me.linked){ renderLink(); return; }
    curRound=me.rounds[0]||"";
    render();
  }

  function renderLink(){
    $("content").innerHTML=
      '<div class="card"><div class="ch">참가 기록을 먼저 연결해주세요</div>'+
      '<p style="font-size:13px;color:var(--muted);margin-bottom:12px">로테이션 소개팅 신청할 때 적었던 전화번호를 입력하면 내 참가 기록과 연결돼요. (연결 후에만 쪽지 기능을 쓸 수 있어요)</p>'+
      '<input id="phone" type="tel" placeholder="01012345678" inputmode="numeric">'+
      '<button class="save" onclick="linkPhone()">연결하기</button><div class="msg" id="link-msg"></div></div>'+
      '<div class="rule">· 참가(입금 확정)한 회차가 있어야 사용할 수 있어요<br>· 아직 참여한 적 없다면 <a href="rotation.html" style="color:var(--amber);font-weight:800">다음 회차 신청하기 →</a></div>';
  }
  async function linkPhone(){
    var p=($("phone").value||"").replace(/[^0-9]/g,"");
    if(p.length<9){ $("link-msg").textContent="전화번호를 정확히 입력해주세요"; return; }
    $("link-msg").textContent="연결 중...";
    try{
      var r=await fetch("/api/airtable?claim=1&kakaoId="+encodeURIComponent(KID),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:p})});
      var d=await r.json();
      if(!r.ok){ $("link-msg").textContent=d.error||"연결 실패"; return; }
      me=await api("rc_me");
      if(me.linked){ curRound=me.rounds[0]||""; render(); }
      else $("link-msg").textContent="이 번호로 참가(입금 확정)한 기록이 없어요. 신청할 때 쓴 번호가 맞는지 확인해주세요.";
    }catch(e){ $("link-msg").textContent="오류가 났어요. 다시 시도해주세요"; }
  }

  function render(){
    var h='<div class="tabs"><div class="tab'+(tab==="find"?" on":"")+'" onclick="setTab(\'find\')">그날 만난 사람</div><div class="tab'+(tab==="box"?" on":"")+'" onclick="setTab(\'box\')">쪽지함</div></div>';
    h+='<div id="panel"><div class="spin"></div></div>';
    $("content").innerHTML=h;
    if(tab==="find") renderFind(); else renderBox();
  }
  function setTab(t){ tab=t; render(); }

  async function renderFind(){
    var h='<div class="card"><div class="ch">내가 참여한 회차 <small>'+esc(me.nickname)+' '+gdTag(me.gender)+'</small></div><div class="chips">';
    me.rounds.forEach(function(r){ h+='<div class="chip'+(r===curRound?" on":"")+'" onclick="pickRound(\''+esc(r).replace(/'/g,"")+'\')">'+esc(r)+'</div>'; });
    h+='</div><div id="people"><div class="spin"></div></div></div>';
    h+='<div class="rule">· 쪽지는 하루 3개까지 보낼 수 있어요<br>· 상대가 수락하면 서로 연락처가 열리고, 거절하면 상대는 알 수 없어요<br>· 같은 분께는 한 번만 보낼 수 있어요</div>';
    $("panel").innerHTML=h;
    var d=await api("rc_people",{round:curRound});
    if(!d.ok){ $("people").innerHTML='<div class="empty">'+esc(d.error||"불러오기 실패")+'</div>'; return; }
    people=d.people||[];
    if(!people.length){ $("people").innerHTML='<div class="empty">이 회차 참가자 정보가 아직 없어요</div>'; return; }
    var g='<div class="grid">';
    people.forEach(function(p,i){
      var av=p.gender==="여성"?"🙋‍♀️":"🙋‍♂️";
      var btn=p.sent?'<button disabled>'+(p.sent==="수락"?"수락됨 🎉":(p.sent==="거절"?"답장 없음":"보냈어요 ✓"))+'</button>':'<button onclick="openModal('+i+')">쪽지 보내기</button>';
      g+='<div class="pp"><div class="av">'+av+'</div><div class="nm">'+esc(p.nickname)+'</div><div class="sub">'+(p.birth?esc(p.birth)+'년생 · ':'')+esc(p.round)+'</div>'+btn+'</div>';
    });
    $("people").innerHTML=g+'</div>';
  }
  function pickRound(r){ curRound=r; renderFind(); }

  async function renderBox(){
    var d=await api("rc_inbox");
    if(!d.ok){ $("panel").innerHTML='<div class="empty">'+esc(d.error||"불러오기 실패")+'</div>'; return; }
    inbox=d;
    var recv=d.items.filter(function(x){return x.dir==="received";}), sent=d.items.filter(function(x){return x.dir==="sent";});
    var h='<div class="card"><div class="ch">받은 쪽지 <small>'+recv.length+'개</small></div>';
    if(!recv.length) h+='<div class="empty">아직 받은 쪽지가 없어요</div>';
    recv.forEach(function(n){ h+=noteHtml(n,true); });
    h+='</div><div class="card"><div class="ch">보낸 쪽지 <small>오늘 '+d.remaining+'개 더 보낼 수 있어요</small></div>';
    if(!sent.length) h+='<div class="empty">아직 보낸 쪽지가 없어요</div>';
    sent.forEach(function(n){ h+=noteHtml(n,false); });
    h+='</div>';
    $("panel").innerHTML=h;
  }
  function stTag(s){ return s==="수락"?'<span class="st ok">수락</span>':(s==="거절"?'<span class="st no">거절</span>':'<span class="st wait">답장 대기</span>'); }
  function noteHtml(n,isRecv){
    var h='<div class="note"><div class="meta"><span>'+esc(n.round)+' · '+esc(n.date)+'</span>'+stTag(n.status)+'</div>';
    h+='<div class="who">'+(isRecv?esc(n.from)+'님이 보냄':esc(n.to)+'님에게')+'</div><div class="txt">'+esc(n.text)+'</div>';
    if(isRecv&&n.status==="대기") h+='<div class="row"><button class="btn g" onclick="respond(\''+n.id+'\',\'거절\')">괜찮아요</button><button class="btn p" onclick="respond(\''+n.id+'\',\'수락\')">수락하고 연락처 열기</button></div>';
    if(n.status==="수락"&&n.contact) h+='<div class="contact">📞 '+esc(n.contact)+'</div>';
    else if(n.status==="수락") h+='<div class="contact">연락처가 열렸어요. 잠시 후 다시 확인해주세요</div>';
    return h+'</div>';
  }
  async function respond(id,ans){
    if(ans==="수락"&&!confirm("수락하면 서로의 연락처가 공개돼요. 괜찮을까요?")) return;
    var d=await api("rc_respond",{noteId:id,answer:ans});
    if(!d.ok){ alert(d.error||"처리 실패"); return; }
    renderBox();
  }

  function openModal(i){
    target=people[i]; if(!target) return;
    $("m-title").textContent=target.nickname+"님께 쪽지";
    $("m-sub").textContent=curRound+" 소개팅에서 만난 분이에요. 상대가 수락해야 연락처가 열려요.";
    $("m-text").value=""; $("m-len").textContent="0"; $("m-msg").textContent=""; $("m-send").disabled=false;
    $("modal").classList.add("on"); $("m-text").focus();
  }
  function closeModal(){ $("modal").classList.remove("on"); }
  $("m-text").addEventListener("input",function(){ $("m-len").textContent=this.value.length; });
  async function sendNote(){
    var t=($("m-text").value||"").trim();
    if(!t){ $("m-msg").textContent="내용을 입력해주세요"; return; }
    $("m-send").disabled=true; $("m-msg").textContent="보내는 중...";
    var d=await api("rc_send",{toId:target.id,round:curRound,text:t});
    if(!d.ok){ $("m-msg").textContent=d.error||"전송 실패"; $("m-send").disabled=false; return; }
    $("m-msg").textContent="보냈어요! 오늘 "+d.remaining+"개 더 보낼 수 있어요";
    setTimeout(function(){ closeModal(); renderFind(); },900);
  }
  $("modal").addEventListener("click",function(e){ if(e.target===this) closeModal(); });

  load();
</script>
</body>
</html>
