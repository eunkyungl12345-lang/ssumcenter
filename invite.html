<!DOCTYPE html>
<html data-theme="light" lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>친구 소개하기 | 썸류센터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="썸류센터 — 친구 소개하고 할인받기">
<meta property="og:description" content="내 링크로 친구가 신청하면, 내 매칭비 2,000원 할인!">
<style>
  :root{color-scheme:light;--bg:#FAFAF8;--card:#FFFFFF;--line:#EEEBE6;--ink:#1E1E1E;--muted:#666666;--faint:#767676;--amber:#E5484D}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;min-height:100vh;padding:24px 18px 48px;letter-spacing:-.01em}
  .wrap{max-width:430px;margin:0 auto}
  .ky{font-size:12px;font-weight:750;color:var(--amber);letter-spacing:.04em;text-align:center}
  h1{font-size:25px;font-weight:800;margin:10px 0 8px;line-height:1.35;text-align:center;word-break:keep-all}
  .sub{font-size:14px;color:var(--muted);line-height:1.7;text-align:center;word-break:keep-all}
  /* 흰 라운드 카드 + 옅은 그림자 (홈과 같은 톤) */
  .card{background:#FFFFFF;border:1px solid rgba(0,0,0,.03);border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,.04);padding:20px;margin-top:16px}
  /* 🎟 초대 할인 쿠폰 */
  .tk{display:flex;align-items:stretch;background:#FFFFFF;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,.05);margin-top:20px;overflow:hidden;text-align:left}
  .tk-l{flex:0 0 96px;background:#FF6B6B;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 6px;border-right:2px dashed rgba(255,255,255,.7)}
  .tk-l b{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .tk-l b small{font-size:12px;font-weight:700}
  .tk-l span{font-size:11px;font-weight:700;opacity:.95;margin-top:3px}
  .tk-r{flex:1;padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--ink);font-weight:700;word-break:keep-all;display:flex;align-items:center}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
  input{width:100%;background:#FAFAF8;border:1.5px solid #E6E2DC;border-radius:13px;color:var(--ink);padding:13px 15px;font-size:16px;font-family:inherit;outline:none}
  input:focus{border-color:var(--amber)}
  .btn{width:100%;background:#FF6B6B;color:#fff;border:none;font-weight:800;padding:15px;border-radius:999px;cursor:pointer;font-size:15px;font-family:inherit;margin-top:11px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn2{width:100%;background:#FFFFFF;border:1.5px solid var(--line);color:var(--ink);font-weight:700;padding:13px;border-radius:999px;cursor:pointer;font-size:13.5px;font-family:inherit;margin-top:9px}
  .btn2:hover{border-color:var(--amber)}
  .linkbox{background:#FAFAF8;border:1.5px dashed #E0DCD5;border-radius:13px;padding:13px 15px;font-size:12.5px;color:#E5484D;word-break:break-all;line-height:1.6;margin-top:4px}
  .steps{display:flex;flex-direction:column;gap:11px;margin-top:14px}
  .step{display:flex;gap:12px;align-items:flex-start}
  .no{flex:0 0 auto;width:23px;height:23px;border-radius:50%;background:rgba(255,107,107,.14);color:var(--amber);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .step p{font-size:13.5px;color:var(--muted);line-height:1.6;word-break:keep-all}
  .step b{color:var(--ink)}
  .hide{display:none!important}
  .home{display:block;text-align:center;margin-top:22px;font-size:12.5px;color:var(--faint);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="ky">💌 친구 소개하기</div>
  <!-- 🎟 초대 혜택 (2026-11 확정): 친구가 내 링크로 신청하면 → '소개한 사람 본인'이 매칭 성사되어 결제할 때 2,000원 할인.
       친구(초대받은 사람)에게는 할인이 없다. "둘 다 할인", "동반 할인", "커피 기프티콘"이라고 쓰지 말 것. -->
  <h1>🎟️ 친구 소개하고,<br><span style="color:var(--amber)">내 매칭비 2,000원 할인!</span></h1>
  <p class="sub">내 링크로 친구가 신청하면, 내가 매칭 성사되어 결제할 때 2,000원 할인 쿠폰을 드려요.</p>
  <div class="tk">
    <div class="tk-l"><b>2,000<small>원</small></b><span>할인 쿠폰</span></div>
    <div class="tk-r">내 매칭이 성사되어 첫 만남을 결제할 때 쓸 수 있어요</div>
  </div>

  <!-- 이름 입력 -->
  <div class="card" id="step1">
    <label for="nm">신청서에 쓰신 이름</label>
    <input id="nm" placeholder="예: 김보경" autocomplete="name" maxlength="20">
    <button class="btn" id="makeBtn">내 초대 링크 만들기</button>
    <p class="sub" style="font-size:11.5px;color:var(--faint);margin-top:11px;text-align:left">
      신청서에 쓰신 이름과 <b style="color:var(--muted)">똑같이</b> 적어주세요.<br>달라지면 누가 소개했는지 못 찾아요.
    </p>
  </div>

  <!-- 결과 -->
  <div class="card hide" id="step2">
    <label>💛 <span id="whose"></span>님의 초대 링크</label>
    <div class="linkbox" id="link"></div>
    <button class="btn" id="copyLinkBtn">🔗 링크 복사하기</button>
    <button class="btn2" id="copyMsgBtn">💬 카톡에 보낼 문구까지 복사</button>
    <button class="btn2" id="againBtn" style="border-style:dashed">✏️ 이름 다시 입력</button>
  </div>

  <!-- 안내 -->
  <div class="card">
    <label>어떻게 되나요?</label>
    <div class="steps">
      <div class="step"><div class="no">1</div><p>위 링크를 <b>솔로인 친구</b>에게 보내주세요.</p></div>
      <div class="step"><div class="no">2</div><p>친구가 링크로 <b>신청을 완료하면 추천인으로 등록돼요.</b></p></div>
      <!-- 금액은 일반 매칭 가격(1on1-admin.html 의 MATCH_PRICE 19,900원) 기준이다. 가격이 바뀌면 여기도 같이 고칠 것. -->
      <div class="step"><div class="no">3</div><p><b>내가 매칭이 성사</b>되어 첫 만남을 결제할 때, <b style="color:#E5484D">2,000원 즉시 할인</b>받아요!</p></div>
    </div>
  </div>

  <a class="home" href="/">← 썸류센터 홈으로</a>
</div>

<script src="/copy-helper.js"></script>
<script>
(function(){
  var SITE = location.origin;
  var nm = document.getElementById("nm");
  var step1 = document.getElementById("step1"), step2 = document.getElementById("step2");
  var linkBox = document.getElementById("link");
  var myLink = "", myName = "";

  function make(){
    var v = (nm.value || "").trim();
    if(!v){ nm.focus(); return; }
    myName = v;
    // 이름에 공백·특수문자가 있어도 주소에서 깨지지 않게 감싼다
    myLink = SITE + "/matching?ref=" + encodeURIComponent(v);
    document.getElementById("whose").textContent = v;
    // 화면에는 한글 그대로 보여주고(읽기 편하게), 복사는 인코딩된 주소로 한다(어디서나 안 깨지게)
    linkBox.textContent = SITE + "/matching?ref=" + v;
    step1.classList.add("hide"); step2.classList.remove("hide");
    try{ localStorage.setItem("ssumInviteName", v); }catch(e){}
  }
  document.getElementById("makeBtn").addEventListener("click", make);
  nm.addEventListener("keydown", function(e){ if(e.key === "Enter") make(); });

  document.getElementById("againBtn").addEventListener("click", function(){
    step2.classList.add("hide"); step1.classList.remove("hide"); nm.focus();
  });

  // copy-helper.js 의 copyText 사용 (클립보드가 막히면 직접 복사할 수 있는 창을 띄워준다)
  function copy(text, okMsg){
    if(window.copyText) window.copyText(text, okMsg);
    else { try{ navigator.clipboard.writeText(text); alert(okMsg); }catch(e){ prompt("아래 내용을 복사해주세요", text); } }
  }
  document.getElementById("copyLinkBtn").addEventListener("click", function(){
    copy(myLink, "링크를 복사했어요! 친구에게 붙여넣기 하세요 💛");
  });
  document.getElementById("copyMsgBtn").addEventListener("click", function(){
    copy(
      // 친구에게는 할인이 없으므로 할인 얘기를 넣지 않는다 (할인은 소개한 사람 몫이다)
      "나 여기서 1:1 소개팅 신청했는데 괜찮더라 😊\n"
      + "센터장 3명이 신청서를 직접 읽고 딱 한 명만 소개해주는 데야.\n"
      + "신청비는 0원이고, 매칭이 성사됐을 때만 결제하면 돼서 부담 없어!\n"
      + "너도 한번 해봐 👇\n\n"
      + myLink,
      "카톡에 보낼 문구까지 복사했어요 💬"
    );
  });

  // 내 페이지에서 ?name= 으로 넘어왔으면 바로 링크까지 만들어준다
  var fromUrl = (new URLSearchParams(location.search).get("name") || "").trim().slice(0, 20);
  if(fromUrl){ nm.value = fromUrl; make(); }
  else {
    // 전에 만들었던 이름이 있으면 미리 채워둔다
    try{ var saved = localStorage.getItem("ssumInviteName"); if(saved){ nm.value = saved; } }catch(e){}
  }
})();
</script>
</body>
</html>
