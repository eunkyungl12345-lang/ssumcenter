<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 홈 | 썸류센터</title>
<style>
  :root{color-scheme:dark;--bg:#0c0a08;--surface:#161310;--surface-2:#1e1811;--ink:#EDE0CC;--muted:#998870;--faint:#6a5c4c;--line:#2a2117;--line-strong:#3a2e1f;--amber:#E8B050;--rose:#E88FB0;--male:#7EA6E0;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.5;letter-spacing:-.01em}
  a{text-decoration:none;color:inherit}
  .wrap{max-width:600px;margin:0 auto;padding:32px 18px 70px}
  .top{text-align:center;margin-bottom:28px}
  .top .badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--amber);background:rgba(232,176,80,.1);border:1px solid rgba(232,176,80,.3);padding:5px 14px;border-radius:999px}
  .top h1{font-size:25px;font-weight:900;margin-top:14px}
  .top p{font-size:13px;color:var(--muted);margin-top:6px}
  .group{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}
  .group .gh{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:900;margin-bottom:4px}
  .group .gd{font-size:12px;color:var(--muted);margin-bottom:15px}
  .rot .gh{color:var(--amber)} .one .gh{color:var(--rose)}
  .links{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .links.solo{grid-template-columns:1fr}
  .lk{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:13px;padding:14px 15px;font-size:14px;font-weight:750;transition:border-color .15s,transform .1s}
  .lk:hover{border-color:var(--amber)} .lk:active{transform:scale(.98)}
  .lk .ico{font-size:19px}
  .lk .ar{margin-left:auto;color:var(--faint);font-size:13px}
  .lk.main{background:linear-gradient(135deg,rgba(232,176,80,.16),rgba(232,176,80,.05));border-color:rgba(232,176,80,.35);color:var(--amber);font-weight:800;grid-column:1/-1}
  .lk.mainone{background:linear-gradient(135deg,rgba(232,143,176,.16),rgba(232,143,176,.05));border-color:rgba(232,143,176,.35);color:var(--rose)}
  .foot{text-align:center;font-size:11.5px;color:var(--faint);margin-top:22px;line-height:1.7}
  .foot a{color:var(--muted)}
  .logout{display:block;width:100%;margin-top:4px;background:transparent;border:1px solid var(--line-strong);color:var(--muted);
          border-radius:13px;padding:12px;font-size:13px;font-weight:750;cursor:pointer;font-family:inherit}
  .logout:hover{border-color:var(--rose);color:var(--rose)}
  .logout:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="badge">SSUMLYU · ADMIN</span>
    <h1>썸류센터 관리자</h1>
    <p>관리할 걸 골라주세요</p>
  </div>

  <!-- 로테이션 그룹 -->
  <div class="group rot">
    <div class="gh">🎡 로테이션 (썸배달) · 8/27</div>
    <div class="gd">신청 승인 → 입금 → 확정 → 라인업 · 출석까지</div>
    <div class="links">
      <a class="lk main" href="/rotation-admin"><span class="ico">📋</span> 신청 승인 · 문자 <span class="ar">→</span></a>
      <a class="lk" href="/lineup"><span class="ico">🎬</span> 라인업 <span class="ar">→</span></a>
      <a class="lk" href="/attendance"><span class="ico">✅</span> 출석부 <span class="ar">→</span></a>
      <a class="lk" href="/vote-admin"><span class="ico">🗳️</span> 투표 <span class="ar">→</span></a>
      <a class="lk" href="/participants" style="grid-column:1/-1"><span class="ico">🎯</span> 참가자 마스터 <span style="font-size:11px;color:var(--faint);font-weight:600">— 누가 겹치게 왔는지 · 단골</span> <span class="ar">→</span></a>
    </div>
  </div>

  <!-- 1:1 매칭 그룹 -->
  <div class="group one">
    <div class="gh">💘 1:1 매칭</div>
    <div class="gd">신청 승인 · 상대 매칭 · 응답/성사 관리</div>
    <div class="links solo">
      <a class="lk mainone" href="/1on1-admin"><span class="ico">💑</span> 1:1 매칭 관리 <span class="ar">→</span></a>
    </div>
  </div>

  <!-- 로그아웃 -->
  <div class="group">
    <div class="gh" style="font-size:15px">🔒 로그인</div>
    <div class="gd">비밀번호는 이 기기에 저장돼요. 한 번 로그인하면 위 페이지 전부 열립니다.<br>
      남의 폰이나 공용 컴퓨터에서 봤다면 꼭 로그아웃해주세요.</div>
    <button class="logout" id="logoutBtn">🚪 로그아웃 (저장된 비밀번호 지우기)</button>
  </div>

  <div class="foot">
    문의: <a href="https://pf.kakao.com/_AxfxcVX" target="_blank" rel="noopener">카카오톡 채널</a>
  </div>
</div>
<script>
  document.getElementById("logoutBtn").addEventListener("click", function(){
    if(!confirm("이 기기에 저장된 관리자 비밀번호를 지울까요?\n다음에 관리자 페이지를 열면 다시 입력해야 해요.")) return;
    try{ localStorage.removeItem("admin_key"); }catch(e){}
    try{ sessionStorage.removeItem("admin_key"); }catch(e){}
    this.textContent = "✅ 로그아웃 됐어요";
    this.disabled = true;
  });
</script>
</body>
</html>
