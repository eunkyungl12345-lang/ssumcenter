<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>센터장 매칭 관리 | 썸류센터</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{font-family:'Noto Sans KR','Inter',sans-serif;background:#0D0D0C;color:#F5F5F3;overflow-x:hidden}
  .y{color:#FFD400}.bg-y{background:#FFD400}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#161615}::-webkit-scrollbar-thumb{background:#FFD400;border-radius:3px}
  .card{transition:all .2s}
  .card:hover{border-color:#FFD400}
  .card.selected{background:rgba(255,212,0,.08);border-color:#FFD400}
</style>
</head>
<body class="min-h-screen selection:bg-[#FFD400] selection:text-black">

<!-- 비밀번호 잠금 화면 -->
<div id="lock-screen" class="fixed inset-0 z-[100] bg-[#0D0D0C] flex items-center justify-center px-5">
  <div class="max-w-sm w-full text-center">
    <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-[#161615] border border-[#FFD400]/30 flex items-center justify-center">
      <i class="fa-solid fa-lock y text-2xl"></i>
    </div>
    <h2 class="text-xl font-black">관리자 인증</h2>
    <p class="text-sm text-[#9E9E97] mt-2">센터장 비밀번호를 입력해주세요</p>
    <div class="mt-6">
      <input type="password" id="pw-input" placeholder="비밀번호 입력"
        onkeydown="if(event.key==='Enter')checkPw()"
        class="w-full bg-[#161615] border border-[#242422] rounded-xl px-4 py-3 text-sm text-white text-center placeholder-[#555] focus:border-[#FFD400] focus:outline-none transition">
      <p id="pw-error" class="hidden text-xs text-red-400 mt-2">비밀번호가 틀렸습니다</p>
      <button onclick="checkPw()" class="bg-y text-black font-extrabold w-full px-6 py-3 rounded-xl text-sm mt-3 transition hover:bg-[#E6BE00]">
        <i class="fa-solid fa-right-to-bracket mr-1.5"></i>로그인
      </button>
    </div>
  </div>
</div>

<!-- 네비 -->
<nav class="sticky top-0 z-50 bg-[#0D0D0C]/95 backdrop-blur-md border-b border-[#242422] px-4 py-3">
  <div class="max-w-4xl mx-auto flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="text-xl font-black tracking-tight">썸류<span class="y">센터</span></span>
      <span class="text-[10px] bg-[#FFD400]/15 text-[#FFD400] border border-[#FFD400]/30 font-bold px-2 py-0.5 rounded-full">ADMIN</span>
    </div>
    <button onclick="loadApplicants()" class="text-sm text-[#9E9E97] hover:text-white transition">
      <i class="fa-solid fa-arrows-rotate mr-1"></i>새로고침
    </button>
  </div>
</nav>

<!-- 메인 -->
<div class="max-w-4xl mx-auto px-5 py-8">

  <!-- 통계 -->
  <div class="grid grid-cols-3 gap-3 mb-8">
    <div class="bg-[#161615] border border-[#242422] rounded-2xl py-4 text-center">
      <div class="text-2xl font-black y" id="stat-total">-</div>
      <div class="text-[11px] text-[#9E9E97] mt-1">전체 신청</div>
    </div>
    <div class="bg-[#161615] border border-[#242422] rounded-2xl py-4 text-center">
      <div class="text-2xl font-black y" id="stat-waiting">-</div>
      <div class="text-[11px] text-[#9E9E97] mt-1">대기 중</div>
    </div>
    <div class="bg-[#161615] border border-[#242422] rounded-2xl py-4 text-center">
      <div class="text-2xl font-black y" id="stat-matched">-</div>
      <div class="text-[11px] text-[#9E9E97] mt-1">매칭 완료</div>
    </div>
  </div>

  <!-- 매칭 도구 -->
  <div class="bg-[#161615] border border-[#FFD400]/20 rounded-2xl p-5 mb-8">
    <h2 class="font-bold text-sm mb-3"><i class="fa-solid fa-heart-circle-plus y mr-1.5"></i>매칭하기</h2>
    <p class="text-xs text-[#9E9E97] mb-4">아래 목록에서 매칭할 두 사람을 클릭하세요</p>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-[#0D0D0C] border border-[#242422] rounded-xl p-3 min-h-[60px]">
        <div class="text-[10px] text-[#9E9E97] font-bold uppercase tracking-wider mb-1">선택 1</div>
        <div id="pick-1" class="text-sm text-[#555]">목록에서 선택</div>
      </div>
      <div class="bg-[#0D0D0C] border border-[#242422] rounded-xl p-3 min-h-[60px]">
        <div class="text-[10px] text-[#9E9E97] font-bold uppercase tracking-wider mb-1">선택 2</div>
        <div id="pick-2" class="text-sm text-[#555]">목록에서 선택</div>
      </div>
    </div>

    <button onclick="generateMatch()" id="match-btn" disabled
      class="bg-y text-black font-extrabold w-full px-6 py-3 rounded-xl text-sm transition hover:bg-[#E6BE00] disabled:opacity-30 disabled:cursor-not-allowed">
      <i class="fa-solid fa-link mr-1.5"></i>매칭 URL 생성
    </button>

    <!-- 매칭 결과 -->
    <div id="match-result" class="hidden mt-4 space-y-3">
      <div class="bg-[#0D0D0C] border border-[#FFD400]/30 rounded-xl p-4">
        <div class="text-[10px] y font-bold uppercase tracking-wider mb-2"><span id="result-name-1"></span>에게 보낼 링크</div>
        <div class="flex gap-2">
          <input type="text" id="url-for-1" readonly class="flex-1 bg-[#161615] border border-[#242422] rounded-lg px-3 py-2 text-xs text-white">
          <button onclick="copyUrl('url-for-1')" class="bg-[#242422] hover:bg-[#FFD400]/10 text-white text-xs font-bold px-3 py-2 rounded-lg transition">복사</button>
        </div>
      </div>
      <div class="bg-[#0D0D0C] border border-[#FFD400]/30 rounded-xl p-4">
        <div class="text-[10px] y font-bold uppercase tracking-wider mb-2"><span id="result-name-2"></span>에게 보낼 링크</div>
        <div class="flex gap-2">
          <input type="text" id="url-for-2" readonly class="flex-1 bg-[#161615] border border-[#242422] rounded-lg px-3 py-2 text-xs text-white">
          <button onclick="copyUrl('url-for-2')" class="bg-[#242422] hover:bg-[#FFD400]/10 text-white text-xs font-bold px-3 py-2 rounded-lg transition">복사</button>
        </div>
      </div>
      <p class="text-[11px] text-[#555] text-center">링크를 복사해서 카카오톡으로 각각 보내주세요</p>
    </div>
  </div>

  <!-- 필터 -->
  <div class="flex gap-2 mb-4">
    <button onclick="filterBy('all')" class="filter-btn active bg-y text-black text-xs font-bold px-3 py-1.5 rounded-full transition" data-filter="all">전체</button>
    <button onclick="filterBy('대기')" class="filter-btn bg-[#161615] border border-[#242422] text-[#9E9E97] text-xs font-bold px-3 py-1.5 rounded-full transition hover:border-[#FFD400]" data-filter="대기">대기</button>
    <button onclick="filterBy('매칭완료')" class="filter-btn bg-[#161615] border border-[#242422] text-[#9E9E97] text-xs font-bold px-3 py-1.5 rounded-full transition hover:border-[#FFD400]" data-filter="매칭완료">매칭완료</button>
    <button onclick="filterBy('남성')" class="filter-btn bg-[#161615] border border-[#242422] text-[#9E9E97] text-xs font-bold px-3 py-1.5 rounded-full transition hover:border-[#FFD400]" data-filter="남성">남성</button>
    <button onclick="filterBy('여성')" class="filter-btn bg-[#161615] border border-[#242422] text-[#9E9E97] text-xs font-bold px-3 py-1.5 rounded-full transition hover:border-[#FFD400]" data-filter="여성">여성</button>
  </div>

  <!-- 신청자 목록 -->
  <div id="applicant-list" class="space-y-3">
    <div class="text-center py-10 text-[#555]">
      <i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i>
      <p class="text-sm">신청자 목록 불러오는 중...</p>
    </div>
  </div>

</div>

<!-- 토스트 -->
<div id="toast" class="fixed bottom-6 inset-x-5 max-w-md mx-auto bg-[#242422] border border-[#FFD400]/30 rounded-xl p-4 text-sm text-center translate-y-32 opacity-0 transition-all duration-300 z-50"></div>

<script>
const AIRTABLE_TOKEN = "patzgC2Hs1t9Bz740.a8dc1c89811da2a4ccf573652ceea6554b4b3dbd968fabadca9c5c250031b17b";
const BASE_ID = "appwejZxBm9oRt0AM";
const TABLE_NAME = "1:1 매칭 신청";
const SITE_URL = "https://ssumcenter.vercel.app";

let applicants = [];
let selected = [null, null];
let currentFilter = "all";

async function loadApplicants(){
  try {
    const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}?sort[0][field]=신청일시&sort[0][direction]=desc`, {
      headers: { "Authorization": `Bearer ${AIRTABLE_TOKEN}` }
    });
    const data = await res.json();
    applicants = data.records || [];
    updateStats();
    renderList();
  } catch(err) {
    console.error(err);
    document.getElementById("applicant-list").innerHTML = '<p class="text-center text-red-400 py-10">데이터를 불러올 수 없습니다</p>';
  }
}

function updateStats(){
  const total = applicants.length;
  const waiting = applicants.filter(r => (r.fields["매칭상태"] || "대기") === "대기").length;
  const matched = applicants.filter(r => r.fields["매칭상태"] === "매칭완료").length;
  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-waiting").textContent = waiting;
  document.getElementById("stat-matched").textContent = matched;
}

function renderList(){
  const list = document.getElementById("applicant-list");
  let filtered = applicants;

  if(currentFilter === "대기" || currentFilter === "매칭완료"){
    filtered = applicants.filter(r => (r.fields["매칭상태"] || "대기") === currentFilter);
  } else if(currentFilter === "남성" || currentFilter === "여성"){
    filtered = applicants.filter(r => r.fields["성별"] === currentFilter);
  }

  if(filtered.length === 0){
    list.innerHTML = '<p class="text-center text-[#555] py-10">신청자가 없습니다</p>';
    return;
  }

  list.innerHTML = filtered.map(r => {
    const f = r.fields;
    const isSelected = selected[0]?.id === r.id || selected[1]?.id === r.id;
    const status = f["매칭상태"] || "대기";
    const statusColor = status === "대기" ? "text-[#FFD400]" : status === "매칭완료" ? "text-emerald-400" : "text-[#9E9E97]";
    const photoUrl = f["프로필사진"] && f["프로필사진"][0] ? f["프로필사진"][0].url : null;

    return `<div class="card bg-[#161615] border border-[#242422] rounded-2xl p-4 cursor-pointer ${isSelected ? 'selected' : ''}" onclick="toggleSelect('${r.id}')">
      <div class="flex gap-3">
        <div class="w-14 h-14 shrink-0 rounded-xl bg-[#242422] border border-[#242422] overflow-hidden flex items-center justify-center">
          ${photoUrl ? `<img src="${photoUrl}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-user text-[#555]"></i>`}
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-bold text-sm">${f["이름"] || "이름없음"}</span>
            <span class="text-[10px] ${statusColor} font-bold">${status}</span>
            <span class="text-[10px] text-[#555]">${f["성별"] || ""}</span>
          </div>
          <div class="text-xs text-[#9E9E97] mt-0.5">${f["출생연도"] || ""}년생 · ${f["직업"] || ""}</div>
          <div class="text-xs text-[#555] mt-1 truncate">${f["자기소개"] || ""}</div>
          <div class="flex flex-wrap gap-1 mt-1.5">
            ${(f["성격키워드"] || "").split(", ").map(kw => kw ? `<span class="text-[10px] bg-[#FFD400]/10 text-[#FFD400] px-1.5 py-0.5 rounded-full">${kw}</span>` : "").join("")}
          </div>
          <div class="text-[10px] text-[#444] mt-1.5">선호: ${f["선호나이대"] || ""} · ${f["선호직업군"] || ""}</div>
        </div>
      </div>
    </div>`;
  }).join("");
}

function toggleSelect(id){
  const record = applicants.find(r => r.id === id);
  if(!record) return;

  if(selected[0]?.id === id){ selected[0] = null; }
  else if(selected[1]?.id === id){ selected[1] = null; }
  else if(!selected[0]){ selected[0] = record; }
  else if(!selected[1]){ selected[1] = record; }
  else { selected[0] = record; selected[1] = null; }

  // UI 업데이트
  document.getElementById("pick-1").innerHTML = selected[0]
    ? `<b class="text-white">${selected[0].fields["이름"]}</b> <span class="text-[#9E9E97]">${selected[0].fields["출생연도"]}년생 · ${selected[0].fields["성별"]}</span>`
    : '<span class="text-[#555]">목록에서 선택</span>';
  document.getElementById("pick-2").innerHTML = selected[1]
    ? `<b class="text-white">${selected[1].fields["이름"]}</b> <span class="text-[#9E9E97]">${selected[1].fields["출생연도"]}년생 · ${selected[1].fields["성별"]}</span>`
    : '<span class="text-[#555]">목록에서 선택</span>';

  document.getElementById("match-btn").disabled = !(selected[0] && selected[1]);
  document.getElementById("match-result").classList.add("hidden");
  renderList();
}

function generateMatch(){
  if(!selected[0] || !selected[1]) return;

  const a = selected[0].fields;
  const b = selected[1].fields;
  const photoA = a["프로필사진"] && a["프로필사진"][0] ? a["프로필사진"][0].url : "";
  const photoB = b["프로필사진"] && b["프로필사진"][0] ? b["프로필사진"][0].url : "";

  // A에게 보낼 링크 (B의 프로필, myId=A의 ID)
  const urlForA = `${SITE_URL}/response.html?id=${selected[1].id}&myId=${selected[0].id}&age=${encodeURIComponent((b["출생연도"]||"")+"년생")}&job=${encodeURIComponent(b["직업"]||"")}&keywords=${encodeURIComponent(b["성격키워드"]||"")}&intro=${encodeURIComponent(b["자기소개"]||"")}&photo1=${encodeURIComponent(photoB)}`;

  // B에게 보낼 링크 (A의 프로필, myId=B의 ID)
  const urlForB = `${SITE_URL}/response.html?id=${selected[0].id}&myId=${selected[1].id}&age=${encodeURIComponent((a["출생연도"]||"")+"년생")}&job=${encodeURIComponent(a["직업"]||"")}&keywords=${encodeURIComponent(a["성격키워드"]||"")}&intro=${encodeURIComponent(a["자기소개"]||"")}&photo1=${encodeURIComponent(photoA)}`;

  document.getElementById("result-name-1").textContent = a["이름"];
  document.getElementById("url-for-1").value = urlForA;
  document.getElementById("result-name-2").textContent = b["이름"];
  document.getElementById("url-for-2").value = urlForB;
  document.getElementById("match-result").classList.remove("hidden");

  // Airtable 매칭상태 업데이트
  updateMatchStatus(selected[0].id);
  updateMatchStatus(selected[1].id);
}

async function updateMatchStatus(recordId){
  try {
    await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}`, {
      method: "PATCH",
      headers: {
        "Authorization": `Bearer ${AIRTABLE_TOKEN}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        records: [{ id: recordId, fields: { "매칭상태": "매칭완료" } }]
      })
    });
  } catch(err){ console.error(err); }
}

function copyUrl(inputId){
  const input = document.getElementById(inputId);
  input.select();
  navigator.clipboard.writeText(input.value);
  toast("링크가 복사되었습니다!");
}

function filterBy(f){
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(btn => {
    if(btn.dataset.filter === f){
      btn.className = "filter-btn active bg-y text-black text-xs font-bold px-3 py-1.5 rounded-full transition";
    } else {
      btn.className = "filter-btn bg-[#161615] border border-[#242422] text-[#9E9E97] text-xs font-bold px-3 py-1.5 rounded-full transition hover:border-[#FFD400]";
    }
  });
  renderList();
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("translate-y-32","opacity-0");
  setTimeout(() => t.classList.add("translate-y-32","opacity-0"), 3000);
}

// 비밀번호 잠금
const ADMIN_PW = "cjfgns0613()!";

function checkPw(){
  const input = document.getElementById("pw-input").value;
  if(input === ADMIN_PW){
    document.getElementById("lock-screen").classList.add("hidden");
    sessionStorage.setItem("admin_auth", "true");
    loadApplicants();
  } else {
    document.getElementById("pw-error").classList.remove("hidden");
    document.getElementById("pw-input").value = "";
    document.getElementById("pw-input").focus();
  }
}

// 세션 유지 (탭 닫기 전까지)
if(sessionStorage.getItem("admin_auth") === "true"){
  document.getElementById("lock-screen").classList.add("hidden");
  loadApplicants();
}
</script>
</body>
</html>
