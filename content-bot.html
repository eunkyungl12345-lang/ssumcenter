<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>콘텐츠봇 | 썸류센터</title>
<style>
  :root{color-scheme:dark;--bg:#0c0a08;--surface:#161310;--surface-2:#1e1811;--ink:#EDE0CC;--ink-2:#C9B896;--muted:#998870;--faint:#6a5c4c;--line:#2a2117;--line-strong:#3a2e1f;--amber:#E8B050;--amber-soft:rgba(212,149,42,.12);--ok:#6FBE97;--rose:#E8828A;--ink-on-amber:#171208;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.55;letter-spacing:-.01em}
  .wrap{max-width:600px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:19px;font-weight:800}
  .sub{font-size:12.5px;color:var(--muted);margin:2px 0 18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 2px 7px}
  input,textarea{width:100%;background:var(--surface-2);border:1.5px solid var(--line-strong);border-radius:11px;padding:12px;font-size:14px;color:var(--ink);font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--amber)}
  .btn{border:none;border-radius:12px;padding:14px 18px;font-size:14.5px;font-weight:800;color:var(--ink-on-amber);background:var(--amber);cursor:pointer;font-family:inherit;width:100%}
  .btn:disabled{opacity:.5;cursor:default}
  .seg{display:flex;gap:8px;margin-bottom:12px}
  .seg button{flex:1;border:1.5px solid var(--line-strong);background:var(--surface-2);color:var(--muted);font-size:14px;font-weight:750;padding:12px;border-radius:11px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--amber);color:var(--ink-on-amber);border-color:transparent}
  .cnt{display:flex;gap:7px;margin-bottom:12px}
  .cnt button{flex:1;border:1.5px solid var(--line-strong);background:var(--surface-2);color:var(--muted);font-size:13px;font-weight:750;padding:9px;border-radius:10px;cursor:pointer;font-family:inherit}
  .cnt button.on{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
  .msg{font-size:12.5px;margin-top:10px;min-height:16px}
  .idea{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;animation:fade .3s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .idea .t{font-size:14.5px;font-weight:800;color:var(--amber);margin-bottom:10px}
  .idea .lbl{font-size:10.5px;font-weight:750;color:var(--muted);letter-spacing:.04em;margin-bottom:3px}
  .idea .hook{font-size:15px;font-weight:750;line-height:1.5;margin-bottom:11px}
  .idea .body{font-size:13.5px;color:var(--ink-2);line-height:1.75;white-space:pre-wrap;margin-bottom:11px}
  .idea .tags{font-size:12.5px;color:var(--amber);word-break:break-all}
  .idea .copy{margin-top:12px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:750;padding:8px 13px;border-radius:100px;cursor:pointer;font-family:inherit}
  .idea .copy.done{color:var(--ok);border-color:var(--ok)}
  .loading{text-align:center;padding:44px 0;color:var(--muted);font-size:13.5px}
  .spin{width:28px;height:28px;border:3px solid var(--line-strong);border-top-color:var(--amber);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hide{display:none}
  a.home{font-size:12px;color:var(--muted);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <!-- 로그인 -->
  <div id="login">
    <h1>콘텐츠봇</h1>
    <div class="sub">센터장 전용 · 관리자 비밀번호</div>
    <div class="card">
      <label class="f">관리자 비밀번호</label>
      <input id="pw" type="password" placeholder="admin 비밀번호">
      <div style="margin-top:12px"><button class="btn" id="loginBtn">로그인</button></div>
      <div class="msg" id="login-msg" style="color:var(--rose)"></div>
    </div>
  </div>

  <!-- 콘솔 -->
  <div id="console" class="hide">
    <h1>🦊 콘텐츠봇</h1>
    <div class="sub">릴스·스레드 소재를 AI가 만들어줘요 · <a class="home" href="/office">오피스 →</a></div>

    <div class="card">
      <label class="f">종류</label>
      <div class="seg" id="seg">
        <button data-type="릴스" class="on">🎬 릴스 소재</button>
        <button data-type="스레드">🧵 스레드 글</button>
      </div>
      <label class="f">주제 (선택)</label>
      <input id="topic" placeholder="예: 8월 로테이션 홍보, 소개팅 첫 대화 꿀팁, 참여 후기 느낌">
      <label class="f" style="margin-top:12px">개수</label>
      <div class="cnt" id="cnt">
        <button data-n="2">2개</button>
        <button data-n="3" class="on">3개</button>
        <button data-n="5">5개</button>
      </div>
      <button class="btn" id="genBtn">✨ 소재 만들기</button>
      <div class="msg" id="msg"></div>
    </div>

    <div id="result"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY="admin_key", type="릴스", n=3;
  function key(){ return sessionStorage.getItem(KEY)||""; }
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function showConsole(){ document.getElementById("login").classList.add("hide"); document.getElementById("console").classList.remove("hide"); }
  if(key()) showConsole();
  document.getElementById("loginBtn").addEventListener("click",doLogin);
  document.getElementById("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });
  function doLogin(){
    var pw=document.getElementById("pw").value; if(!pw) return;
    sessionStorage.setItem(KEY,pw); showConsole();
  }

  document.getElementById("seg").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    [].forEach.call(this.children,function(x){x.classList.remove("on");}); b.classList.add("on"); type=b.dataset.type;
  });
  document.getElementById("cnt").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    [].forEach.call(this.children,function(x){x.classList.remove("on");}); b.classList.add("on"); n=+b.dataset.n;
  });

  document.getElementById("genBtn").addEventListener("click",function(){
    var btn=this, msg=document.getElementById("msg");
    btn.disabled=true; msg.textContent="";
    document.getElementById("result").innerHTML='<div class="loading"><div class="spin"></div>AI가 소재를 짜는 중… (10~20초)</div>';
    fetch("/api/content",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key()},
      body:JSON.stringify({type:type,topic:document.getElementById("topic").value.trim(),count:n})})
      .then(function(r){return r.json();}).then(function(r){
        btn.disabled=false;
        if(r.error){
          document.getElementById("result").innerHTML="";
          msg.textContent="❌ "+r.error; msg.style.color="var(--rose)";
          if(/ANTHROPIC/.test(r.error)) msg.textContent="❌ AI 키가 아직 없어요. Vercel에 ANTHROPIC_API_KEY 넣으면 바로 돼요.";
          return;
        }
        render(r);
      }).catch(function(){ btn.disabled=false; document.getElementById("result").innerHTML=""; msg.textContent="❌ 오류가 났어요."; msg.style.color="var(--rose)"; });
  });

  function render(r){
    var ideas=r.ideas||[]; var box=document.getElementById("result"); box.innerHTML="";
    if(!ideas.length){ box.innerHTML='<div class="loading">소재가 안 나왔어요. 다시 시도해주세요.</div>'; return; }
    ideas.forEach(function(it,i){
      var el=document.createElement("div"); el.className="idea";
      el.innerHTML='<div class="t">'+(i+1)+'. '+esc(it.title||"")+'</div>'
        +'<div class="lbl">후킹</div><div class="hook">'+esc(it.hook||"")+'</div>'
        +'<div class="lbl">'+(r.kind==="릴스"?"장면·자막 구성":"본문")+'</div><div class="body">'+esc(it.body||"")+'</div>'
        +'<div class="lbl">해시태그</div><div class="tags">'+esc(it.hashtags||"")+'</div>'
        +'<button class="copy">📋 복사</button>';
      var full=[it.hook,"",it.body,"",it.hashtags].join("\n");
      el.querySelector(".copy").addEventListener("click",function(){
        var b=this; navigator.clipboard.writeText(full).then(function(){ b.textContent="복사됨 ✓"; b.classList.add("done"); setTimeout(function(){ b.textContent="📋 복사"; b.classList.remove("done"); },1500); });
      });
      box.appendChild(el);
    });
  }
})();
</script>
</body>
</html>
