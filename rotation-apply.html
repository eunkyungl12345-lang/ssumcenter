<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로테이션 소개팅 신청 | 썸류센터</title>
<style>
  :root{color-scheme:dark;--bg:#0c0a08;--surface:#161310;--surface-2:#1e1811;--ink:#EDE0CC;--muted:#998870;--line:#3a2e1f;--amber:#E8B050;--ink-on-amber:#171208;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;letter-spacing:-.01em}
  .box{max-width:400px;width:100%;text-align:center}
  .ky{font-size:12px;font-weight:750;color:var(--amber);letter-spacing:.04em}
  h1{font-size:23px;font-weight:800;margin:9px 0 6px;line-height:1.3}
  .sub{font-size:13px;color:var(--muted);margin-bottom:24px}
  .opt{display:flex;flex-direction:column;gap:11px}
  .opt a{display:flex;align-items:center;gap:13px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:var(--ink);text-align:left;transition:.15s}
  .opt a:hover{border-color:var(--amber);background:var(--surface-2)}
  .opt a .em{font-size:26px}
  .opt a .t{flex:1;font-size:16px;font-weight:800}
  .opt a .t small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
  .opt a .ar{color:var(--amber);font-weight:800}
  .home{display:inline-block;margin-top:20px;font-size:12.5px;color:var(--muted);text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <div class="ky">💛 썸배달 · 로테이션 소개팅</div>
    <h1>어느 회차에<br>신청하시겠어요?</h1>
    <div class="sub">날짜를 선택하면 신청서로 이동해요</div>
    <div class="opt">
      <a href="/rotation-0813"><span class="em">📦</span><span class="t">8월 13일 (목)<small>저녁 7:45 · 강남역 인근</small></span><span class="ar">→</span></a>
      <a href="/rotation-0827"><span class="em">📦</span><span class="t">8월 27일 (목)<small>저녁 7:45 · 강남역 인근</small></span><span class="ar">→</span></a>
    </div>
    <a class="home" href="/">← 홈으로</a>
  </div>
</body>
</html>
