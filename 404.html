<!DOCTYPE html>
<html data-theme="light" lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없어요 | 썸류센터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{color-scheme:light;--bg:#FAFAF8;--card:#FFFFFF;--line:#D9D5CD;--ink:#1E1E1E;--muted:#666666;--amber:#E5484D}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;letter-spacing:-.01em;text-align:center}
  .box{max-width:380px;width:100%}
  .em{font-size:46px;margin-bottom:16px}
  h1{font-size:22px;font-weight:800;line-height:1.4;word-break:keep-all}
  p{font-size:14px;color:var(--muted);line-height:1.75;margin-top:10px;word-break:keep-all}
  .btn{display:block;background:var(--amber);color:#1E1E1E;font-weight:800;padding:15px;border-radius:14px;text-decoration:none;font-size:15px;margin-top:24px}
  .btn2{display:block;background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-weight:700;padding:13px;border-radius:13px;text-decoration:none;font-size:13.5px;margin-top:9px}
  .foot{margin-top:20px;font-size:12.5px;color:#767676}
  .foot a{color:var(--muted)}
</style>
</head>
<body>
  <!-- 없는 주소로 들어온 손님에게 보여주는 화면.
       예전에는 이 파일이 없어서 영어로 된 기본 오류 화면이 떴다. -->
  <div class="box">
    <div class="em">📦</div>
    <h1>이 주소로는<br>배송할 수 없어요</h1>
    <p>주소가 바뀌었거나 없는 페이지예요.<br>문자로 받은 링크라면 <b style="color:var(--ink)">링크 전체</b>를 눌러 다시 열어주세요.</p>
    <a class="btn" href="/">썸류센터 홈으로</a>
    <a class="btn2" href="/oneone">💌 1:1 맞춤 소개팅 보러가기</a>
    <div class="foot">계속 안 되면 <a href="https://pf.kakao.com/_AxfxcVX" target="_blank" rel="noopener">카카오톡 채널</a>로 알려주세요</div>
  </div>
</body>
</html>
