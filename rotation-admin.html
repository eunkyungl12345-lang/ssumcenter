<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로테이션 신청 관리 | 썸류센터</title>
<style>
  :root{color-scheme:dark;--bg:#0c0a08;--surface:#161310;--surface-2:#1e1811;--ink:#EDE0CC;--muted:#998870;--faint:#6a5c4c;--line:#2a2117;--line-strong:#3a2e1f;--amber:#E8B050;--amber-soft:rgba(212,149,42,.12);--ok:#6FBE97;--ok-soft:rgba(111,190,151,.13);--rose:#E8828A;--rose-soft:rgba(232,130,138,.13);--ink-on-amber:#171208;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.5;letter-spacing:-.01em}
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:19px;font-weight:800}
  .sub{font-size:12.5px;color:var(--muted);margin:2px 0 18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 2px 6px}
  input{width:100%;background:var(--surface-2);border:1.5px solid var(--line-strong);border-radius:11px;padding:12px;font-size:14px;color:var(--ink);font-family:inherit}
  input:focus{outline:none;border-color:var(--amber)}
  .btn{border:none;border-radius:11px;padding:12px 16px;font-size:14px;font-weight:800;color:var(--ink-on-amber);background:var(--amber);cursor:pointer;font-family:inherit;width:100%}
  .btn.sm{width:auto;padding:8px 13px;font-size:12px}
  .btn.g{background:transparent;color:var(--muted);border:1.5px solid var(--line-strong)}
  .msg{font-size:12.5px;margin-top:10px;color:var(--rose)}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-size:13px;font-weight:750;padding:8px 15px;border-radius:100px;cursor:pointer;font-family:inherit}
  .tab.on{background:var(--amber);color:var(--ink-on-amber);border-color:transparent}
  .stabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .stab{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-size:12px;font-weight:700;padding:6px 12px;border-radius:100px;cursor:pointer;font-family:inherit}
  .stab.on{background:var(--amber);color:var(--ink-on-amber);border-color:transparent}
  .stat{display:flex;gap:9px;margin-bottom:14px}
  .stat .b{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}
  .stat .b .k{font-size:11px;color:var(--muted)}.stat .b .v{font-size:19px;font-weight:800;margin-top:2px}
  .stat .b.wait .v{color:var(--amber)}.stat .b.ok .v{color:var(--ok)}
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .toolbar .cnt{font-size:12.5px;color:var(--muted);font-weight:650;margin-left:auto}
  .p{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px}
  .p .top{display:flex;gap:12px}
  .p .ph{width:64px;height:64px;border-radius:13px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line-strong);flex-shrink:0;display:block}
  .p .ph.none{display:grid;place-items:center;font-size:26px;color:var(--faint)}
  .p .phwrap{position:relative;flex-shrink:0;cursor:pointer}
  .p .phwrap .phcount{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.72);color:#fff;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:7px}
  .p .phwrap .phzoom{position:absolute;top:3px;left:3px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 5px;border-radius:6px}
  /* 사진 크게 보기 (라이트박스) */
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;z-index:200;align-items:center;justify-content:center}
  #lb.on{display:flex}
  #lb img{max-width:94vw;max-height:82vh;object-fit:contain;border-radius:10px}
  #lb .lb-close{position:absolute;top:14px;right:18px;color:#fff;font-size:30px;cursor:pointer;font-weight:700;line-height:1}
  #lb .lb-nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:40px;cursor:pointer;padding:10px 14px;user-select:none;-webkit-tap-highlight-color:transparent}
  #lb .lb-prev{left:2px} #lb .lb-next{right:2px}
  #lb .lb-count{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;font-weight:700;background:rgba(0,0,0,.5);padding:4px 12px;border-radius:999px}
  .p .hd{flex:1;min-width:0}
  .p .nm{font-size:15.5px;font-weight:800}
  .p .nm .nick{font-size:12.5px;color:var(--amber);font-weight:700;margin-left:6px}
  .p .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
  .p .badge{font-size:10.5px;font-weight:750;padding:3px 9px;border-radius:100px}
  .b-wait{background:var(--amber-soft);color:var(--amber)}
  .b-ok{background:var(--ok-soft);color:var(--ok)}
  .b-no{background:var(--rose-soft);color:var(--rose)}
  .p .rows{margin-top:11px;border-top:1px solid var(--line);padding-top:11px;display:grid;gap:5px}
  .p .r{display:flex;font-size:12.5px}
  .p .r .rk{color:var(--muted);width:66px;flex-shrink:0}
  .p .r .rv{color:var(--ink);flex:1}
  .p .r .rv a{color:var(--amber)}
  .p .nosms{display:flex;align-items:center;gap:7px;margin-top:12px;padding:8px 10px;border-radius:10px;
            background:var(--surface-2);border:1px solid var(--line-strong);font-size:12px;color:var(--muted);cursor:pointer}
  .p .nosms input{width:15px;height:15px;accent-color:var(--amber);cursor:pointer;flex:none;margin:0}
  .p .nosms.on{border-color:var(--amber);color:var(--amber)}
  .p .acts{display:flex;gap:7px;margin-top:8px}
  .p .acts button{flex:1;border-radius:10px;padding:9px;font-size:12.5px;font-weight:750;font-family:inherit;cursor:pointer;border:1.5px solid var(--line-strong);background:transparent;color:var(--muted)}
  .p .acts button.a-ok.on{background:var(--ok);color:#062;border-color:transparent}
  .p .acts button.a-wait.on{background:var(--amber);color:var(--ink-on-amber);border-color:transparent}
  .p .acts button.a-no.on{background:var(--rose);color:#3a1013;border-color:transparent}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 0}
  .hide{display:none}
  .spin{width:26px;height:26px;border:3px solid var(--line-strong);border-top-color:var(--amber);border-radius:50%;margin:30px auto;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  a.home{font-size:12px;color:var(--muted);text-decoration:none}
  .feecard{display:flex;align-items:center;gap:10px;padding:12px 14px}
  .feecard label{margin:0;flex-shrink:0}
  /* 문자봇 시트 */
  .sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
  .sheet.on{display:flex}
  .sheetbox{background:var(--surface);width:100%;max-width:620px;border-radius:20px 20px 0 0;padding:20px 18px 26px;border-top:1px solid var(--line-strong);animation:up .25s ease}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .sheetbox h3{font-size:15.5px;font-weight:800}
  .sheetbox .who{font-size:12.5px;color:var(--muted);margin:2px 0 13px}
  .tpls{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
  .tpl{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:700;padding:8px 13px;border-radius:100px;cursor:pointer;font-family:inherit}
  .tpl.on{background:var(--amber);color:var(--ink-on-amber);border-color:transparent}
  .sheetbox textarea{width:100%;min-height:158px;background:var(--surface-2);border:1.5px solid var(--line-strong);border-radius:12px;padding:13px;font-size:13.5px;color:var(--ink);font-family:inherit;line-height:1.7;resize:vertical}
  .sheetbox textarea:focus{outline:none;border-color:var(--amber)}
  .mform input,.mform select{width:100%;box-sizing:border-box;background:var(--surface-2);border:1.5px solid var(--line-strong);border-radius:12px;padding:12px;font-size:13.5px;color:var(--ink);font-family:inherit}
  .mform input:focus,.mform select:focus{outline:none;border-color:var(--amber)}
  .sheet-acts{display:flex;gap:8px;margin-top:12px}
  .sheet-acts button{flex:1;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}
  .sheet-acts .cancel{background:var(--surface-2);color:var(--muted);border:1px solid var(--line-strong)}
  .sheet-acts .send{background:var(--amber);color:var(--ink-on-amber)}
</style>
</head>
<body>
<div class="wrap">
  <!-- 로그인 -->
  <div id="login">
    <h1>로테이션 신청 관리</h1>
    <div class="sub">센터장 전용 · 관리자 비밀번호</div>
    <div class="card">
      <label class="f">관리자 비밀번호</label>
      <input id="pw" type="password" placeholder="admin 비밀번호">
      <div style="margin-top:12px"><button class="btn" id="loginBtn">로그인</button></div>
      <div class="msg" id="login-msg"></div>
    </div>
  </div>

  <!-- 콘솔 -->
  <div id="console" class="hide">
    <h1>📋 로테이션 신청 관리</h1>
    <div class="sub">회차별로 신청자를 보고 승인해요 · <a class="home" href="/lineup">🎬 라인업 →</a> · <a class="home" href="/attendance">📋 출석부 →</a> · <a class="home" href="/admin">🏠 홈</a> · <a class="home" href="/vote-admin">투표 →</a></div>

    <div class="card feecard">
      <label class="f">참가비</label>
      <input id="fee" placeholder="예: 29,900원 (입금안내 문자에 들어가요)">
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="stat">
      <div class="b"><div class="k">전체</div><div class="v" id="st-all">–</div></div>
      <div class="b wait"><div class="k">대기</div><div class="v" id="st-wait">–</div></div>
      <div class="b ok"><div class="k">승인</div><div class="v" id="st-ok">–</div></div>
    </div>
    <div class="toolbar">
      <button class="btn g sm" id="refreshBtn">새로고침</button>
      <button class="btn g sm" id="reminderBtn" style="background:#8B5CF6;color:#fff;border:none">📢 전날 안내 일괄발송</button>
      <button class="btn g sm" id="muntoBtn" style="background:#22c55e;color:#fff;border:none">➕ 문토 신청자 추가</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <input id="rot-search" oninput="rotSearch(this.value)" placeholder="🔍 이름·연락처로 찾기" style="width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:11px;padding:11px 13px;font-size:13.5px;color:var(--ink);font-family:inherit;margin-bottom:10px;outline:none">
    <div class="stabs" id="status-tabs"></div>
    <div id="list"></div>
  </div>
</div>

<!-- 문토 신청자 수기 추가 시트 -->
<div class="sheet" id="munto-sheet">
  <div class="sheetbox">
    <h3>➕ 문토 신청자 라인업 추가</h3>
    <div class="who">문토로 신청한 분을 라인업(입금확정)에 바로 올려요. * 는 필수예요.</div>
    <div class="mform" style="display:flex;flex-direction:column;gap:9px">
      <div style="display:flex;gap:9px">
        <input id="m-name" placeholder="이름 *" style="flex:1">
        <select id="m-gender" style="width:120px"><option value="">성별 *</option><option value="여성">여성</option><option value="남성">남성</option></select>
      </div>
      <div style="display:flex;gap:9px">
        <input id="m-birth" placeholder="출생연도 (예:1995)" inputmode="numeric" style="flex:1">
        <input id="m-height" placeholder="키 (예:170)" inputmode="numeric" style="width:140px">
      </div>
      <input id="m-job" placeholder="직업 / 직장명">
      <input id="m-appeal" placeholder="어필포인트 (라인업에 보여요)">
      <div style="display:flex;gap:9px">
        <input id="m-drink" placeholder="음료 (예:아메리카노)" style="flex:1">
        <input id="m-round" placeholder="회차" style="width:150px">
      </div>
      <input id="m-phone" placeholder="연락처 (선택)" inputmode="tel">
    </div>
    <div class="sheet-acts">
      <button class="cancel" id="m-cancel">닫기</button>
      <button class="send" id="m-save">라인업에 추가</button>
    </div>
    <div class="msg" id="m-msg" style="text-align:center;color:#ef6b6b;margin-top:8px"></div>
  </div>
</div>

<!-- 문자봇 시트 -->
<div class="sheet" id="sms-sheet">
  <div class="sheetbox">
    <h3>📨 문자 보내기</h3>
    <div class="who" id="sms-who"></div>
    <div class="tpls" id="sms-tpls"></div>
    <textarea id="sms-text"></textarea>
    <div class="sheet-acts">
      <button class="cancel" id="sms-cancel">닫기</button>
      <button class="send" id="sms-send">문자 보내기</button>
    </div>
    <div class="msg" id="sms-msg" style="text-align:center"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var TABLE="로테이션 신청", KEY="admin_key";
  var records=[], curRound="전체", curStatus="전체", searchQ="";
  window.rotSearch=function(v){ searchQ=(v||"").trim().toLowerCase(); render(); };
  // 🔁 가장 최신 회차 자동 감지 (문토 추가 기본값 등에 사용)
  function roundKey(rd){ var m=String(rd||"").match(/(\d{1,2})\s*\/\s*(\d{1,2})/); return m?(parseInt(m[1])*100+parseInt(m[2])):0; }
  function latestRound(){ var best="", bk=-1; records.forEach(function(x){ var rd=(x.fields||{})["회차"]; if(rd){ var k=roundKey(rd); if(k>bk){bk=k; best=rd;} } }); return best||"8/27 (목)"; }
  function matchStatus(f, s){
    var st=f["승인상태"]||"대기", paid=f["입금확정"]==="O";
    if(s==="전체") return true;
    if(s==="대기") return st==="대기";
    if(s==="승인") return st==="승인";
    if(s==="입금전") return st==="승인" && !paid;
    if(s==="입금완료") return st==="승인" && paid;
    if(s==="거절") return st==="거절";
    return true;
  }
  // 🔕 "문자 안 보내기"를 켠 신청자 (화면이 새로고침돼도 유지되도록 기억)
  var quietSet={};
  // 로그인 정보는 localStorage에 저장 (다른 관리자 페이지와 동일 — 한 번 로그인하면 전부 열림)
  function key(){ return localStorage.getItem(KEY)||""; }
  function api(method,body){
    return fetch("/api/airtable?table="+encodeURIComponent(TABLE)+(method==="GET"?"&sort=신청일시":""),{
      method:method,headers:{"Content-Type":"application/json","x-admin-key":key()},
      body:body?JSON.stringify(body):undefined
    }).then(function(r){return r.json();});
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function showConsole(){ document.getElementById("login").classList.add("hide"); document.getElementById("console").classList.remove("hide"); }
  if(key()) { showConsole(); load(); }
  document.getElementById("loginBtn").addEventListener("click",doLogin);
  document.getElementById("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });
  function doLogin(){
    var pw=document.getElementById("pw").value; if(!pw) return;
    fetch("/api/admin-auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})})
      .then(function(r){return r.json();}).then(function(d){
        if(d.ok){ localStorage.setItem(KEY,pw); showConsole(); load(); }
        else { document.getElementById("login-msg").textContent="비밀번호가 틀렸어요."; }
      }).catch(function(){ document.getElementById("login-msg").textContent="오류가 났어요. 잠시 후 다시 해주세요."; });
  }
  document.getElementById("refreshBtn").addEventListener("click",load);
  function load(){
    document.getElementById("list").innerHTML='<div class="spin"></div>';
    api("GET").then(function(r){ if(r.error){ alert(r.error); return; } records=r.records||[]; render(); });
  }

  function render(){
    // 회차 탭
    var rounds=["전체"];
    records.forEach(function(x){ var rd=x.fields["회차"]; if(rd && String(rd).indexOf("8/13")<0 && rounds.indexOf(rd)<0) rounds.push(rd); });
    // 최신 회차가 앞쪽에 오도록 정렬 ("전체"는 항상 맨 앞)
    rounds=["전체"].concat(rounds.filter(function(r){return r!=="전체";}).sort(function(a,b){return roundKey(b)-roundKey(a);}));
    var tabs=document.getElementById("tabs"); tabs.innerHTML="";
    rounds.forEach(function(rd){
      var b=document.createElement("button"); b.className="tab"+(rd===curRound?" on":""); b.textContent=rd;
      b.addEventListener("click",function(){ curRound=rd; render(); });
      tabs.appendChild(b);
    });

    var filtered=records.filter(function(x){ return curRound==="전체" || x.fields["회차"]===curRound; });
    // 통계 (현재 회차 기준)
    document.getElementById("st-all").textContent=filtered.length;
    document.getElementById("st-wait").textContent=filtered.filter(function(x){return (x.fields["승인상태"]||"대기")==="대기";}).length;
    document.getElementById("st-ok").textContent=filtered.filter(function(x){return x.fields["승인상태"]==="승인";}).length;

    // 🔍 이름·연락처 검색 (있으면 추가로 걸러냄)
    var searched = searchQ ? filtered.filter(function(x){ var f=x.fields||{};
      return ((f["이름"]||"")+" "+(f["닉네임"]||"")+" "+(f["연락처"]||"")).toLowerCase().indexOf(searchQ)>=0; }) : filtered;

    // 상태별 필터 칩 (대기/승인/입금전/입금완료/거절)
    var statusList=["전체","대기","승인","입금전","입금완료","거절"];
    var sTabs=document.getElementById("status-tabs"); sTabs.innerHTML="";
    statusList.forEach(function(s){
      var cnt=searched.filter(function(x){ return matchStatus(x.fields||{}, s); }).length;
      var b=document.createElement("button"); b.className="stab"+(s===curStatus?" on":"");
      b.textContent=s+" "+cnt;
      b.addEventListener("click",function(){ curStatus=s; render(); });
      sTabs.appendChild(b);
    });

    var shown=searched.filter(function(x){ return matchStatus(x.fields||{}, curStatus); });
    document.getElementById("cnt").textContent=curRound+" · "+curStatus+" "+shown.length+"명";

    var list=document.getElementById("list"); list.innerHTML="";
    if(!shown.length){ list.innerHTML='<div class="empty">해당하는 신청자가 없어요.</div>'; return; }
    PHSETS=[];

    // 👦👧 남/여 2단 분리 (좁은 화면에선 자동으로 위아래로 쌓임)
    var males=shown.filter(function(x){return (x.fields||{})["성별"]==="남성";});
    var females=shown.filter(function(x){return (x.fields||{})["성별"]==="여성";});
    var etc=shown.filter(function(x){var g=(x.fields||{})["성별"]; return g!=="남성"&&g!=="여성";});
    function col(title,arr,color){
      var c=document.createElement("div"); c.style.cssText="flex:1 1 300px;min-width:280px";
      var h=document.createElement("div"); h.style.cssText="position:sticky;top:0;z-index:2;font-weight:900;font-size:13px;color:"+color+";background:var(--bg);padding:8px 11px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line-strong)";
      h.innerHTML=title+' <span style="color:var(--muted);font-weight:600;font-size:12px">'+arr.length+'명</span>';
      c.appendChild(h);
      if(arr.length){ arr.forEach(function(x){ c.appendChild(cardEl(x)); }); }

        if(r && r.error){ alert("실패했어요: "+r.error); return; }
        f["입금확정"]="O";
        alert("✅ 입금확정 처리됨 (문자는 보내지 않았어요)\n(라인업에 자동 등록됐어요)");
      });
      return;
    }

    if(!to){ alert("연락처가 없어요."); return; }
    var already = f["입금확정"]==="O";
    var q = already
      ? "⚠️ "+who+"님은 이미 입금확정 + 확정문자가 발송된 분이에요.\n\n확정문자를 '한 번 더' 보낼까요? (중복 발송됩니다)"
      : who+"님\n→ 입금확정 처리 + '최종 확정 안내' 문자를 보낼까요?\n(라인업에도 자동 등록돼요)";
    if(!confirm(q)) return;
    // 입금확정 표시 → 라인업 자동 등록
    api("PATCH",{records:[{id:x.id,fields:{"입금확정":"O"}}]}).then(function(){ f["입금확정"]="O"; });
    sendSmsTo(to, TPLS["확정"](f)).then(function(r){ alert(r&&r.ok?"✅ 입금확정 처리 + 확정문자 발송됨\n(라인업에 자동 등록됐어요)":"입금확정 표시는 됐어요. 문자는 실패: "+((r&&r.error)||"")); });
  };
  // 전날 안내 일괄 발송 (현재 회차 · 승인자 전원)
  document.getElementById("reminderBtn").addEventListener("click",function(){
    var targets=records.filter(function(x){ return (curRound==="전체"||x.fields["회차"]===curRound) && x.fields["승인상태"]==="승인" && x.fields["연락처"]; });
    if(!targets.length){ alert("이 회차에 승인된(연락처 있는) 참가자가 없어요."); return; }
    if(!confirm("승인된 "+targets.length+"명에게 '전날 안내(장소)' 문자를 일괄 발송할까요?")) return;
    var btn=this; btn.disabled=true; var orig=btn.textContent; btn.textContent="발송 중…";
    var ok=0, done=0;
    targets.forEach(function(x){
      sendSmsTo(x.fields["연락처"], TPLS["전날 리마인드"](x.fields))
        .then(function(r){ if(r&&r.ok) ok++; }).catch(function(){})
        .then(function(){ done++; if(done===targets.length){ btn.disabled=false; btn.textContent=orig; alert("✅ 전날 안내 발송 완료: "+ok+"/"+targets.length+"명"); } });
    });
  });

  var smsSheet=document.getElementById("sms-sheet"), smsText=document.getElementById("sms-text"),
      smsWho=document.getElementById("sms-who"), smsTpls=document.getElementById("sms-tpls"), smsTarget=null;
  window.openSms=function(f){
    smsTarget=f;
    smsWho.textContent=(f["닉네임"]||f["이름"]||"")+" · "+(f["연락처"]||"번호없음");
    smsTpls.innerHTML=""; document.getElementById("sms-msg").textContent="";
    var keys=Object.keys(TPLS);
    keys.forEach(function(k,i){
      var b=document.createElement("button"); b.className="tpl"+(i===0?" on":""); b.textContent=k;
      b.addEventListener("click",function(){ [].forEach.call(smsTpls.children,function(c){c.classList.remove("on");}); b.classList.add("on"); smsText.value=TPLS[k](f); });
      smsTpls.appendChild(b);
    });
    smsText.value=TPLS[keys[0]](f);
    smsSheet.classList.add("on");
  };
  document.getElementById("sms-cancel").addEventListener("click",function(){ smsSheet.classList.remove("on"); });
  smsSheet.addEventListener("click",function(e){ if(e.target===smsSheet) smsSheet.classList.remove("on"); });
  document.getElementById("sms-send").addEventListener("click",function(){
    if(!smsTarget){ return; }
    var to=smsTarget["연락처"]; if(!to){ alert("연락처가 없어요."); return; }
    var btn=this, msgEl=document.getElementById("sms-msg");
    btn.disabled=true; msgEl.textContent="보내는 중…"; msgEl.style.color="var(--muted)";
    fetch("/api/send-sms",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key()},
      body:JSON.stringify({to:to,text:smsText.value})})
      .then(function(r){return r.json();}).then(function(r){
        btn.disabled=false;
        if(r.ok){ msgEl.textContent="✅ 문자 보냈어요!"; msgEl.style.color="var(--ok)"; setTimeout(function(){ smsSheet.classList.remove("on"); },1200); }
        else { msgEl.textContent="❌ "+(r.error||"발송 실패"); msgEl.style.color="var(--rose)"; }
      }).catch(function(){ btn.disabled=false; msgEl.textContent="❌ 오류가 났어요."; msgEl.style.color="var(--rose)"; });
  });

  // ===== 사진 크게 보기 =====
  var LB={photos:[],i:0};
  window.openLB=function(pid){ LB.photos=PHSETS[pid]||[]; LB.i=0; if(!LB.photos.length) return; showLB(); document.getElementById("lb").classList.add("on"); };
  function showLB(){ document.getElementById("lb-img").src=LB.photos[LB.i]; document.getElementById("lb-count").textContent=(LB.i+1)+" / "+LB.photos.length; var nav=LB.photos.length>1?"block":"none"; Array.prototype.forEach.call(document.querySelectorAll("#lb .lb-nav"),function(e){ e.style.display=nav; }); }
  window.lbNav=function(d){ if(LB.photos.length<2) return; LB.i=(LB.i+d+LB.photos.length)%LB.photos.length; showLB(); };
  window.closeLB=function(){ document.getElementById("lb").classList.remove("on"); };
})();
</script>

<!-- 사진 크게보기 라이트박스 -->
<div id="lb" onclick="if(event.target.id==='lb')closeLB()">
  <span class="lb-close" onclick="closeLB()">✕</span>
  <span class="lb-nav lb-prev" onclick="lbNav(-1)">‹</span>
  <img id="lb-img" src="" alt="프로필 사진">
  <span class="lb-nav lb-next" onclick="lbNav(1)">›</span>
  <span class="lb-count" id="lb-count"></span>
</div>
</body>
</html>
