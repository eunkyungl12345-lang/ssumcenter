<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8/27 라인업 | 썸류센터</title>
<style>
  :root{color-scheme:dark;--bg:#0c0a08;--surface:#161310;--surface-2:#1e1811;--ink:#EDE0CC;--muted:#998870;--faint:#6a5c4c;--line:#2a2117;--line-strong:#3a2e1f;--amber:#E8B050;--ink-on-amber:#171208;--male:#7EA6E0;--female:#E88FB0;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.5;letter-spacing:-.01em}
  .wrap{max-width:640px;margin:0 auto;padding:22px 16px 70px}
  h1{font-size:22px;font-weight:800}
  .sub{font-size:12.5px;color:var(--muted);margin:3px 0 18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}
  input{width:100%;background:var(--surface-2);border:1.5px solid var(--line-strong);border-radius:11px;padding:12px;font-size:14px;color:var(--ink);font-family:inherit}
  input:focus{outline:none;border-color:var(--amber)}
  .btn{border:none;border-radius:11px;padding:12px 16px;font-size:14px;font-weight:800;color:var(--ink-on-amber);background:var(--amber);cursor:pointer;font-family:inherit;width:100%}
  .btn.g{background:transparent;color:var(--muted);border:1.5px solid var(--line-strong);width:auto;padding:9px 14px;font-size:12.5px;font-weight:750}
  .hide{display:none}
  .cols{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
  .col{flex:1 1 280px}
  .col-h{position:sticky;top:0;font-weight:900;font-size:14px;padding:9px 12px;border-radius:11px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line)}
  .col-h.m{color:var(--male)} .col-h.f{color:var(--female)}
  .lu{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px}
  .lu .hd{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px}
  .lu.m .hd{color:var(--male)} .lu.f .hd{color:var(--female)}
  .lu .job{font-size:13px;color:var(--ink);margin-top:7px}
  .lu .job b{color:var(--muted);font-weight:600;font-size:11.5px;display:block;margin-bottom:1px}
  .lu .appeal{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.6;border-top:1px solid var(--line);padding-top:9px;white-space:pre-wrap}
  .empty{text-align:center;color:var(--muted);padding:44px 0;font-size:13px}
  .spin{width:26px;height:26px;border:3px solid var(--line-strong);border-top-color:var(--amber);border-radius:50%;margin:34px auto;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  a.home{font-size:12px;color:var(--muted);text-decoration:none}
  .privacy{font-size:11.5px;color:var(--faint);text-align:center;margin:16px 0;line-height:1.5}
  .sect-h{font-weight:900;font-size:15px;padding:8px 2px 9px;margin-bottom:8px;border-bottom:1px solid var(--line-strong)}
  .sect-h.f{color:var(--female)} .sect-h.m{color:var(--male)}
  .line{font-size:14px;padding:10px 13px;background:var(--surface);border:1px solid var(--line);border-radius:11px;margin-bottom:7px;word-break:keep-all;line-height:1.5}
  .line.f{border-left:3px solid var(--female)} .line.m{border-left:3px solid var(--male)}
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .toolbar .cnt{font-size:12.5px;color:var(--muted);margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <!-- 로그인 (지금은 어드민 전용) -->
  <div id="login">
    <h1>🎬 라인업</h1>
    <div class="sub">센터장 전용 (공개 전) · 관리자 비밀번호</div>
    <div class="card">
      <input id="pw" type="password" placeholder="admin 비밀번호">
      <div style="margin-top:12px"><button class="btn" id="loginBtn">로그인</button></div>
      <div id="login-msg" style="font-size:12.5px;color:#E8828A;margin-top:10px"></div>
    </div>
  </div>

  <!-- 콘솔 -->
  <div id="console" class="hide">
    <h1>🎬 8/27 라인업</h1>
    <div class="sub">입금 확정된 분이 자동으로 올라와요<br><a class="home" href="/rotation-admin">← 로테이션</a> · <a class="home" href="/attendance">📋 출석부</a> · <a class="home" href="/vote-admin">🗳️ 투표</a> · <a class="home" href="/admin">1:1·재테크</a></div>
    <div class="toolbar">
      <button class="btn g" id="refreshBtn">새로고침</button>
      <button class="btn g" onclick="copyLu()" style="background:#8B5CF6;color:#fff;border:none">📋 SNS 텍스트 복사</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <div id="drinks"></div>
    <div class="privacy">🔒 실명·연락처·사진은 비공개 · 나이대/키/직업/어필포인트만 표시돼요</div>
    <div id="list"></div>
  </div>
</div>
<script>
  var KEY="admin_key";
  function key(){ return localStorage.getItem(KEY)||""; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function ageBand(y){ y=parseInt(y,10); if(!y) return ""; var a=2026-y;
    if(a<=23) return "20대 초반"; if(a<=26) return "20대 중반"; if(a<=29) return "20대 후반";
    if(a<=33) return "30대 초반"; if(a<=36) return "30대 중반"; return "30대 후반"; }

  document.getElementById("loginBtn").addEventListener("click",doLogin);
  document.getElementById("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });
  function doLogin(){
    var pw=document.getElementById("pw").value;
    fetch("/api/admin-auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})})
      .then(function(r){return r.json();}).then(function(d){
        if(d.ok){ localStorage.setItem(KEY,pw); showConsole(); }
        else { document.getElementById("login-msg").textContent="비밀번호가 틀렸어요"; }
      }).catch(function(){ document.getElementById("login-msg").textContent="오류가 났어요."; });
  }
  function showConsole(){ document.getElementById("login").classList.add("hide"); document.getElementById("console").classList.remove("hide"); load(); }
  if(key()){ showConsole(); }

  document.getElementById("refreshBtn").addEventListener("click",load);
  function load(){
    document.getElementById("list").innerHTML='<div class="spin"></div>';
    fetch("/api/airtable?table="+encodeURIComponent("로테이션 신청"),{headers:{"x-admin-key":key()}}).then(function(r){return r.json();}).then(function(r){
      if(r.error){ document.getElementById("list").innerHTML='<div class="empty">'+esc(r.error)+'</div>'; return; }
      var recs=(r.records||[]).filter(function(x){ var f=x.fields||{}; return f["입금확정"]==="O" && String(f["회차"]||"").indexOf("8/27")>=0; });
      render(recs);
    }).catch(function(){ document.getElementById("list").innerHTML='<div class="empty">불러오기 오류</div>'; });
  }
  function ageShort(y){ y=parseInt(y,10); if(!y) return "?"; var a=2026-y;
    var b = a<=23?"20초":a<=26?"20중":a<=29?"20후":a<=33?"30초":a<=36?"30중":"30후";
    return b+"("+String(y).slice(-2)+")"; }
  function personLine(f){
    var appeal=String(f["어필포인트"]||"").split("\n")[0].trim();
    return ageShort(f["출생연도"])+" / "+(f["직업_직장명"]||"직업미정")+" / "+(f["키"]||"?")+" / "+(appeal||"-");
  }
  var _luText="";
  function render(recs){
    var males=recs.filter(function(x){return (x.fields||{})["성별"]==="남성";});
    var females=recs.filter(function(x){return (x.fields||{})["성별"]==="여성";});
    document.getElementById("cnt").textContent="확정 "+recs.length+"명 (남 "+males.length+" · 여 "+females.length+")";
    // ☕ 음료 자동 집계
    var drinks={}; recs.forEach(function(x){ var d=(x.fields||{})["음료선택"]||"기타"; drinks[d]=(drinks[d]||0)+1; });
    var dkeys=Object.keys(drinks);
    document.getElementById("drinks").innerHTML = recs.length && dkeys.length
      ? '<div class="card" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 15px"><b style="color:var(--amber);font-size:13px">☕ 음료 집계</b>'
        + dkeys.map(function(k){return '<span style="font-size:13px;color:var(--ink)">'+esc(k)+' <b style="color:var(--amber)">'+drinks[k]+'잔</b></span>';}).join('<span style="color:var(--line-strong)">·</span>')
        + '</div>' : '';
    if(!recs.length){ document.getElementById("list").innerHTML='<div class="empty">아직 입금 확정된 참가자가 없어요.<br>rotation-admin에서 "💰 입금확인" 누르면 여기 자동으로 올라와요.</div>'; _luText=""; return; }
    // SNS 붙여넣기용 텍스트
    _luText="🩷📦 8/27(목) 썸배달 라인업 📦🩷\n\n🙋‍♀️ 여성 라인업\n"
      + (females.length?females.map(function(x){return personLine(x.fields||{});}).join("\n"):"(준비중)")
      + "\n\n🙋‍♂️ 남성 라인업\n"
      + (males.length?males.map(function(x){return personLine(x.fields||{});}).join("\n"):"(준비중)");
    // 화면 표시 (한 줄 리스트)
    function sect(title,arr,cls){
      return '<div style="margin-bottom:18px"><div class="sect-h '+cls+'">'+title+' <span style="color:var(--muted);font-weight:600;font-size:12px">'+arr.length+'명</span></div>'
        + (arr.length?arr.map(function(x){return '<div class="line '+cls+'">'+esc(personLine(x.fields||{}))+'</div>';}).join(""):'<div class="empty" style="padding:14px 0">아직 없어요</div>')+'</div>';
    }
    document.getElementById("list").innerHTML = sect("🙋‍♀️ 여성 라인업",females,"f")+sect("🙋‍♂️ 남성 라인업",males,"m");
  }
  window.copyLu=function(){
    if(!_luText){ alert("아직 라인업이 없어요."); return; }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(_luText).then(function(){ alert("✅ 라인업 복사됨!\n인스타·스레드에 붙여넣으세요 📲"); }, function(){ alert("복사 실패 — 길게 눌러 복사해주세요"); }); }
    else alert("이 기기에선 자동복사가 안 돼요 (텍스트 직접 선택 복사)");
  };
</script>
</body>
</html>
