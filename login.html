<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 썸류센터</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR','Inter',sans-serif;background:#0a0a09;color:#f5f5f3;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  ::selection{background:#FFD400;color:#000}
  .y{color:#FFD400}
  .card{background:#131312;border-radius:24px;border:1px solid rgba(255,255,255,.06)}
  .input{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;font-size:14px;color:#fff;outline:none;transition:border-color .2s;font-family:inherit}
  .input::placeholder{color:#444}
  .input:focus{border-color:rgba(255,212,0,.5)}
  .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,212,0,.08);border:1px solid rgba(255,212,0,.18);color:#FFD400;padding:6px 16px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.5px}
  .btn{width:100%;padding:16px;border-radius:16px;font-size:15px;font-weight:800;border:none;cursor:pointer;transition:all .2s;font-family:inherit}
  .btn-primary{background:#FFD400;color:#0a0a09}
  .btn-primary:hover{filter:brightness(.9)}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .label{display:block;font-size:12px;font-weight:600;color:#888;margin-bottom:8px}
  .label .req{color:#FFD400}
</style>
</head>
<body>

<!-- Nav -->
<nav class="sticky top-0 z-50 backdrop-blur-xl bg-[#0a0a09]/80 border-b border-white/[.04] px-5 py-3.5">
  <div class="max-w-[480px] mx-auto flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2"><img src="logo.png" alt="썸류센터" class="h-7"></a>
    <a href="signup.html" class="text-sm font-semibold text-[#888] hover:text-white transition">회원가입</a>
  </div>
</nav>

<main class="flex-1 flex items-center justify-center px-5 py-10">
  <div class="w-full max-w-[400px]">

    <div class="text-center mb-8">
      <span class="badge mb-4"><i class="fa-solid fa-right-to-bracket"></i> LOGIN</span>
      <h1 class="text-2xl font-black mt-3">썸류센터 <span class="y">로그인</span></h1>
      <p class="text-sm text-[#888] mt-2">가입한 연락처로 로그인하세요</p>
    </div>

    <form id="login-form" class="space-y-5" onsubmit="return handleLogin(event)">
      <div class="card p-6 space-y-5">
        <div>
          <label class="label">연락처 <span class="req">*</span></label>
          <input type="tel" name="phone" required placeholder="010-0000-0000" class="input" id="phone-input">
        </div>
        <div>
          <label class="label">비밀번호 <span class="req">*</span></label>
          <div class="relative">
            <input type="password" name="password" required placeholder="비밀번호를 입력해주세요" class="input" id="pw-input">
            <button type="button" onclick="togglePw()" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#555] hover:text-white transition text-sm"><i class="fa-solid fa-eye" id="pw-icon"></i></button>
          </div>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary">
        <i class="fa-solid fa-right-to-bracket mr-1.5"></i>로그인
      </button>

      <p id="error-msg" class="text-center text-sm text-red-400 hidden"></p>

      <p class="text-center text-xs text-[#555] mt-2">
        아직 계정이 없으신가요? <a href="signup.html" class="y font-bold hover:underline">회원가입</a>
      </p>
    </form>
  </div>
</main>

<footer class="border-t border-white/[.04] px-5 py-8 text-center">
  <p class="text-[11px] text-[#444]">문의: 카카오톡 채널 @썸류센터</p>
</footer>

<script>
function togglePw(){
  const pw=document.getElementById('pw-input');
  const icon=document.getElementById('pw-icon');
  if(pw.type==='password'){pw.type='text';icon.className='fa-solid fa-eye-slash'}
  else{pw.type='password';icon.className='fa-solid fa-eye'}
}

document.getElementById('phone-input').addEventListener('input',function(){
  let v=this.value.replace(/[^0-9]/g,'');
  if(v.length>3&&v.length<=7)v=v.slice(0,3)+'-'+v.slice(3);
  else if(v.length>7)v=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
  this.value=v;
});

async function handleLogin(e){
  e.preventDefault();
  const err=document.getElementById('error-msg');
  err.classList.add('hidden');

  const form=document.getElementById('login-form');
  const data=new FormData(form);
  const p=Object.fromEntries(data.entries());

  const btn=document.getElementById('submit-btn');
  btn.disabled=true;
  btn.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>로그인 중...';

  try{
    const res=await fetch('/api/auth?action=login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone:p.phone,password:p.password})
    });
    const result=await res.json();

    if(!res.ok){
      err.textContent=result.error||'로그인에 실패했습니다.';
      err.classList.remove('hidden');
      btn.disabled=false;
      btn.innerHTML='<i class="fa-solid fa-right-to-bracket mr-1.5"></i>로그인';
      return false;
    }

    localStorage.setItem('ssumUser',JSON.stringify(result.user));
    window.location.href='index.html';
  }catch(e){
    err.textContent='네트워크 오류가 발생했습니다.';
    err.classList.remove('hidden');
    btn.disabled=false;
    btn.innerHTML='<i class="fa-solid fa-right-to-bracket mr-1.5"></i>로그인';
  }
  return false;
}
</script>
</body>
</html>
