<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 썸류센터</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--bg:#110f0b;--surface:#1a1612;--amber:#E8A020;--amber-light:#F5C960;--cream:#F5E6D0;--muted:#9e8e78;--dim:#6a5e50;--faint:#3a3228;--glass:rgba(30,26,20,.65);--glass-border:rgba(255,200,120,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
::selection{background:var(--amber);color:#000}
.gm{font-family:'Gmarket Sans',Pretendard,sans-serif}

/* Layout */
.page{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.box{width:100%;max-width:400px}

/* Logo area */
.logo-area{text-align:center;margin-bottom:40px}
.logo-area img{height:32px;margin-bottom:16px}
.logo-area h1{font-size:24px;font-weight:700}
.logo-area p{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.6}

/* Social buttons */
.social-btn{width:100%;padding:16px;border-radius:14px;font-size:15px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-family:inherit;transition:all .2s;margin-bottom:10px}
.social-btn:hover{transform:translateY(-1px)}
.btn-kakao{background:#FEE500;color:#191919}
.btn-kakao:hover{background:#F5DC00}

/* Divider */
.divider{display:flex;align-items:center;gap:16px;margin:28px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--faint)}
.divider span{font-size:12px;color:var(--dim);white-space:nowrap}

/* Form */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px}
.form-input{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--faint);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--cream);outline:none;transition:border-color .2s;font-family:inherit}
.form-input::placeholder{color:var(--dim)}
.form-input:focus{border-color:rgba(232,160,32,.4)}
.pw-wrap{position:relative}
.pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px}

/* Submit */
.submit-btn{width:100%;padding:16px;border-radius:14px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all .2s;background:var(--amber);color:#000;margin-top:8px}
.submit-btn:hover{background:var(--amber-light);transform:translateY(-1px)}
.submit-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* Error */
.error-msg{text-align:center;font-size:13px;color:#ff6b6b;margin-top:12px;display:none}
.error-msg.show{display:block}

/* Links */
.links{text-align:center;margin-top:24px;font-size:13px;color:var(--dim)}
.links a{color:var(--amber);font-weight:600}
.links a:hover{text-decoration:underline}

/* Footer */
.hidden{display:none!important}
.foot{text-align:center;padding:20px;font-size:11px;color:var(--faint)}

/* Nav */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--glass-border)}
.top-bar a{font-size:13px;color:var(--muted);transition:color .2s}
.top-bar a:hover{color:var(--cream)}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html"><img src="logo.png" alt="썸류센터" style="height:24px"></a>
  <a href="signup.html">회원가입</a>
</div>

<main class="page">
  <div class="box">
    <div class="logo-area">
      <h1 class="gm">다시 만나서 반가워요 👋</h1>
      <p>로그인하고 설렘을 이어가세요</p>
    </div>

    <!-- 소셜 로그인 -->
    <button class="social-btn btn-kakao" onclick="kakaoLogin()">
      <svg width="20" height="20" viewBox="0 0 18 18"><path fill="#191919" d="M9 1C4.58 1 1 3.8 1 7.2c0 2.18 1.45 4.1 3.63 5.2-.16.56-.57 2.03-.66 2.35-.1.39.14.39.3.28.12-.08 1.94-1.32 2.72-1.85.64.09 1.3.14 1.97.14 4.42 0 8-2.8 8-6.2C17 3.8 13.42 1 9 1"/></svg>
      카카오로 로그인
    </button>

    <div class="divider"><span>또는 이메일로 로그인</span></div>

    <!-- 이메일 로그인 -->
    <form id="login-form" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input type="email" name="email" required placeholder="example@email.com" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <div class="pw-wrap">
          <input type="password" name="password" required placeholder="비밀번호를 입력해주세요" class="form-input" id="pw">
          <button type="button" class="pw-toggle" onclick="const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">로그인</button>
      <p class="error-msg" id="err"></p>
    </form>

    <div class="links">
      아직 계정이 없으신가요? <a href="signup.html">회원가입</a>
    </div>
  </div>
</main>

<div class="foot">문의: 카카오톡 채널 @썸류센터</div>

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient('https://nvqlguhzsucrcnmjlxoe.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52cWxndWh6c3VjcmNubWpseG9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDk4NDgsImV4cCI6MjA5NjU4NTg0OH0.ClU6JArejkQQibf6XBFuYkF-fCQKnD2cVzJgXvkdgNc');
Kakao.init('702b5ffe9fbe4643438cdedc5e4e1a52');

function kakaoLogin(){
  Kakao.Auth.authorize({redirectUri:'https://ssumcenter.vercel.app/auth-callback.html'});
}

async function handleLogin(e){
  e.preventDefault();
  const err=document.getElementById('err');
  err.classList.remove('show');
  const fd=new FormData(document.getElementById('login-form'));
  const p=Object.fromEntries(fd.entries());
  const btn=document.getElementById('submit-btn');
  btn.disabled=true;btn.textContent='로그인 중...';
  try{
    const{data,error}=await sb.auth.signInWithPassword({email:p.email,password:p.password});
    if(error){err.textContent=error.message==='Invalid login credentials'?'이메일 또는 비밀번호가 일치하지 않아요':error.message;err.classList.add('show');btn.disabled=false;btn.textContent='로그인';return false}
    const{data:profile}=await sb.from('profiles').select('*').eq('id',data.user.id).single();
    localStorage.setItem('ssumUser',JSON.stringify(profile||{id:data.user.id}));
    window.location.href='index.html';
  }catch(e){err.textContent='네트워크 오류가 발생했어요';err.classList.add('show');btn.disabled=false;btn.textContent='로그인'}
  return false;
}
</script>
</body>
</html>
