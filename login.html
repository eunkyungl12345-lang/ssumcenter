<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 썸류센터</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--bg:#110f0b;--surface:#1a1612;--amber:#E8A020;--amber-light:#F5C960;--cream:#F5E6D0;--muted:#9e8e78;--dim:#6a5e50;--faint:#3a3228;--glass-border:rgba(255,200,120,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
::selection{background:var(--amber);color:#000}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--glass-border)}
.top-bar a{font-size:13px;color:var(--muted);transition:color .2s}
.top-bar a:hover{color:var(--cream)}
.page{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.box{width:100%;max-width:380px;text-align:center}
.logo-area{margin-bottom:36px}
.logo-area img{height:34px;margin-bottom:20px}
.logo-area h1{font-size:23px;font-weight:800;line-height:1.35}
.logo-area p{font-size:14px;color:var(--muted);margin-top:12px;line-height:1.7}
.btn-kakao{width:100%;padding:16px;border-radius:14px;font-size:15.5px;font-weight:800;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;font-family:inherit;transition:transform .12s,filter .2s;background:#FEE500;color:#191919}
.btn-kakao:hover{filter:brightness(.97)} .btn-kakao:active{transform:scale(.99)}
.note{font-size:12px;color:var(--dim);margin-top:16px;line-height:1.6}
.foot{text-align:center;padding:20px;font-size:11px;color:var(--faint)}
.foot a{color:var(--amber)}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html"><img src="logo.png" alt="썸류센터" style="height:24px"></a>
  <a href="index.html">홈으로</a>
</div>

<main class="page">
  <div class="box">
    <div class="logo-area">
      <img src="logo.png" alt="썸류센터">
      <h1>카카오로 3초 만에<br>시작하기 💛</h1>
      <p>로그인하고 설렘을 이어가세요.<br>따로 가입할 필요 없어요!</p>
    </div>

    <button class="btn-kakao" onclick="kakaoLogin()">
      <svg width="20" height="20" viewBox="0 0 18 18"><path fill="#191919" d="M9 1C4.58 1 1 3.8 1 7.2c0 2.18 1.45 4.1 3.63 5.2-.16.56-.57 2.03-.66 2.35-.1.39.14.39.3.28.12-.08 1.94-1.32 2.72-1.85.64.09 1.3.14 1.97.14 4.42 0 8-2.8 8-6.2C17 3.8 13.42 1 9 1"/></svg>
      카카오로 로그인
    </button>

    <p class="note">로그인 시 카카오 프로필(이름·사진)을 이용해<br>썸류센터 회원으로 자동 등록돼요.</p>
  </div>
</main>

<div class="foot">문의: <a href="https://pf.kakao.com/_AxfxcVX" target="_blank" rel="noopener">카카오톡 채널 →</a></div>

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
<script>
Kakao.init('702b5ffe9fbe4643438cdedc5e4e1a52');
function kakaoLogin(){
  const redirect=new URLSearchParams(location.search).get('redirect')||'';
  Kakao.Auth.authorize({
    redirectUri:location.origin+'/auth-callback.html',
    state:redirect
  });
}
</script>
</body>
</html>
