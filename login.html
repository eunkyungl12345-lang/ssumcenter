<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 썸류센터</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR','Inter',sans-serif;background:#0e0c0a;color:#f5f5f3;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  ::selection{background:#FFBE2E;color:#000}
  .y{color:#FFBE2E}
  .card{background:#16140f;border-radius:24px;border:1px solid rgba(255,255,255,.06)}
  .input{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;font-size:14px;color:#fff;outline:none;transition:border-color .2s;font-family:inherit}
  .input::placeholder{color:#5a5248}
  .input:focus{border-color:rgba(255,212,0,.5)}
  .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,212,0,.08);border:1px solid rgba(255,212,0,.18);color:#FFBE2E;padding:6px 16px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.5px}
  .btn{width:100%;padding:16px;border-radius:16px;font-size:15px;font-weight:800;border:none;cursor:pointer;transition:all .2s;font-family:inherit}
  .btn-primary{background:#FFBE2E;color:#0e0c0a}
  .btn-primary:hover{filter:brightness(.9)}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .label{display:block;font-size:12px;font-weight:600;color:#9a9080;margin-bottom:8px}
  .label .req{color:#FFBE2E}
</style>
</head>
<body>

<!-- Nav -->
<nav class="sticky top-0 z-50 backdrop-blur-xl bg-[#0e0c0a]/80 border-b border-white/[.04] px-5 py-3.5">
  <div class="max-w-[480px] mx-auto flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2"><img src="logo.png" alt="썸류센터" class="h-7"></a>
    <a href="signup.html" class="text-sm font-semibold text-[#9a9080] hover:text-white transition">회원가입</a>
  </div>
</nav>

<main class="flex-1 flex items-center justify-center px-5 py-10">
  <div class="w-full max-w-[400px]">

    <div class="text-center mb-8">
      <span class="badge mb-4"><i class="fa-solid fa-right-to-bracket"></i> LOGIN</span>
      <h1 class="text-2xl font-black mt-3">썸류센터 <span class="y">로그인</span></h1>
      <p class="text-sm text-[#9a9080] mt-2">가입한 연락처로 로그인하세요</p>
    </div>

    <!-- 카카오 로그인 -->
    <div class="card p-6 text-center" style="margin-bottom:20px">
      <button type="button" onclick="kakaoLogin()" style="width:100%;padding:14px;border-radius:14px;background:#FEE500;color:#000;font-weight:700;font-size:15px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;transition:filter .2s" onmouseover="this.style.filter='brightness(.95)'" onmouseout="this.style.filter=''">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#000" d="M9 1C4.58 1 1 3.8 1 7.2c0 2.18 1.45 4.1 3.63 5.2-.16.56-.57 2.03-.66 2.35-.1.39.14.39.3.28.12-.08 1.94-1.32 2.72-1.85.64.09 1.3.14 1.97.14 4.42 0 8-2.8 8-6.2C17 3.8 13.42 1 9 1"/></svg>
        카카오로 로그인
      </button>
      <p style="font-size:11px;color:#5a5248;margin-top:12px">또는 이메일로 로그인</p>
      <div style="width:100%;height:1px;background:rgba(255,255,255,.06);margin-top:14px"></div>
    </div>

    <form id="login-form" class="space-y-5" onsubmit="return handleLogin(event)">
      <div class="card p-6 space-y-5">
        <div>
          <label class="label">이메일 <span class="req">*</span></label>
          <input type="email" name="email" required placeholder="example@email.com" class="input">
        </div>
        <div>
          <label class="label">비밀번호 <span class="req">*</span></label>
          <div class="relative">
            <input type="password" name="password" required placeholder="비밀번호를 입력해주세요" class="input" id="pw-input">
            <button type="button" onclick="togglePw()" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#6b6358] hover:text-white transition text-sm"><i class="fa-solid fa-eye" id="pw-icon"></i></button>
          </div>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary">
        <i class="fa-solid fa-right-to-bracket mr-1.5"></i>로그인
      </button>

      <p id="error-msg" class="text-center text-sm text-red-400 hidden"></p>

      <p class="text-center text-xs text-[#6b6358] mt-2">
        아직 계정이 없으신가요? <a href="signup.html" class="y font-bold hover:underline">회원가입</a>
      </p>
    </form>
  </div>
</main>

<footer class="border-t border-white/[.04] px-5 py-8 text-center">
  <p class="text-[11px] text-[#5a5248]">문의: 카카오톡 채널 @썸류센터</p>
</footer>

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://nvqlguhzsucrcnmjlxoe.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52cWxndWh6c3VjcmNubWpseG9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDk4NDgsImV4cCI6MjA5NjU4NTg0OH0.ClU6JArejkQQibf6XBFuYkF-fCQKnD2cVzJgXvkdgNc';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);

// 카카오 SDK 초기화
Kakao.init('702b5ffe9fbe4643438cdedc5e4e1a52');

function kakaoLogin(){
  Kakao.Auth.login({
    success:function(authObj){
      Kakao.API.request({
        url:'/v2/user/me',
        success:function(res){
          const user={
            id:'kakao_'+res.id,
            name:res.properties?.nickname||'카카오 유저',
            profileImage:res.properties?.profile_image||'',
            provider:'kakao'
          };
          localStorage.setItem('ssumUser',JSON.stringify(user));
          window.location.href='index.html';
        },
        fail:function(err){alert('사용자 정보 조회 실패: '+JSON.stringify(err))}
      });
    },
    fail:function(err){alert('카카오 로그인 실패: '+JSON.stringify(err))}
  });
}

function togglePw(){
  const pw=document.getElementById('pw-input');
  const icon=document.getElementById('pw-icon');
  if(pw.type==='password'){pw.type='text';icon.className='fa-solid fa-eye-slash'}
  else{pw.type='password';icon.className='fa-solid fa-eye'}
}

async function handleLogin(e){
  e.preventDefault();
  const err=document.getElementById('error-msg');
  err.classList.add('hidden');

  const form=document.getElementById('login-form');
  const data=new FormData(form);
  const p=Object.fromEntries(data.entries());

  const btn=document.getElementById('submit-btn');
  btn.disabled=true;
  btn.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>로그인 중...';

  try{
    const{data:authData,error:authErr}=await sb.auth.signInWithPassword({email:p.email,password:p.password});

    if(authErr){
      err.textContent=authErr.message==='Invalid login credentials'?'연락처 또는 비밀번호가 일치하지 않습니다.':authErr.message;
      err.classList.remove('hidden');
      btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-right-to-bracket mr-1.5"></i>로그인';
      return false;
    }

    // 프로필 정보 가져오기
    const{data:profile}=await sb.from('profiles').select('*').eq('id',authData.user.id).single();
    localStorage.setItem('ssumUser',JSON.stringify(profile||{id:authData.user.id}));
    window.location.href='index.html';
  }catch(e){
    err.textContent='네트워크 오류가 발생했습니다.';
    err.classList.remove('hidden');
    btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-right-to-bracket mr-1.5"></i>로그인';
  }
  return false;
}
</script>
</body>
</html>
